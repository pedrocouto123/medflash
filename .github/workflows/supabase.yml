# Publica o banco de dados e o webhook da Kiwify no Supabase a cada push na main
# que mude algo em supabase/. Também pode ser rodado à mão em Actions > Supabase > Run workflow.
#
# Configure em GitHub > Settings > Secrets and variables > Actions:
#   Secrets:
#     SUPABASE_ACCESS_TOKEN  -> https://supabase.com/dashboard/account/tokens
#     SUPABASE_DB_PASSWORD   -> a senha do banco criada com o projeto
#     KIWIFY_TOKEN           -> (opcional até ter o webhook na Kiwify)
#   Variables:
#     SUPABASE_PROJECT_REF   -> o código do projeto (ex.: abcdxyz em https://abcdxyz.supabase.co)
#     APP_URL                -> endereço do app na Vercel (ex.: https://medflash.vercel.app)
name: Supabase

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Verificar configuração
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::Supabase ainda não configurado. Adicione SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD (secrets) e SUPABASE_PROJECT_REF (variable). Veja o README."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ok == 'true'
        with:
          version: latest

      - name: Conectar ao projeto
        if: steps.cfg.outputs.ok == 'true'
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Aplicar banco de dados (migrations)
        if: steps.cfg.outputs.ok == 'true'
        run: supabase db push --include-all

      - name: Publicar função kiwify-webhook
        if: steps.cfg.outputs.ok == 'true'
        run: supabase functions deploy kiwify-webhook --no-verify-jwt --project-ref "$PROJECT_REF"

      - name: Definir segredos da função
        if: steps.cfg.outputs.ok == 'true'
        env:
          APP_URL: ${{ vars.APP_URL }}
          KIWIFY_TOKEN: ${{ secrets.KIWIFY_TOKEN }}
        run: |
          args=()
          [ -n "$APP_URL" ] && args+=("APP_URL=$APP_URL")
          [ -n "$KIWIFY_TOKEN" ] && args+=("KIWIFY_TOKEN=$KIWIFY_TOKEN")
          if [ ${#args[@]} -gt 0 ]; then
            supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}"
          else
            echo "::notice::APP_URL e KIWIFY_TOKEN ainda não definidos; pulei os segredos."
          fi

      - name: Endereço do webhook
        if: steps.cfg.outputs.ok == 'true'
        run: echo "::notice::URL do webhook para a Kiwify -> https://$PROJECT_REF.supabase.co/functions/v1/kiwify-webhook"
