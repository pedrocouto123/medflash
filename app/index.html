<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse Medcards</title>
<meta name="theme-color" content="#FBF8F9">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<script>
  // Aplica o tema salvo antes de desenhar, para não piscar
  try { const t = localStorage.getItem("pm_tema"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
/* =====================================================================
   Pulse Medcards — visual
   Papel de eletrocardiograma no painel "Hoje"; o resto fica quieto.
   Cores de estado seguem o Anki: Novos azul, Aprendendo laranja, Revisar verde.
   ===================================================================== */
:root {
  --fundo: #FBF8F9;
  --superficie: #FFFFFF;
  --superficie-2: #F6F0F2;
  --tinta: #241C26;
  --tinta-2: #6E6371;
  --tinta-3: #9A8F9D;
  --linha: #ECE2E6;
  --pulso: #C2255C;
  --pulso-forte: #A01A4A;
  --pulso-suave: #FCEBF1;
  --grade-ecg: rgba(194, 37, 92, .10);
  --grade-ecg-forte: rgba(194, 37, 92, .20);
  --novo: #2563C9;
  --aprendendo: #D9480F;
  --revisar: #3B7D23;
  --jovem: #0FA3A3;
  --maduro: #3B7D23;
  --novamente: #C92A2A;
  --sombra: 0 1px 2px rgba(36, 28, 38, .05), 0 6px 18px rgba(36, 28, 38, .05);
  --f: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-grande: 20px;
  --r-medio: 14px;
  --r-peq: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fundo: #141016; --superficie: #1D1820; --superficie-2: #251F29; --tinta: #F3EEF4; --tinta-2: #ABA0AF; --tinta-3: #7D7281;
    --linha: #352D39; --pulso: #F0628F; --pulso-forte: #F58DAE; --pulso-suave: #2C1822;
    --grade-ecg: rgba(240, 98, 143, .10); --grade-ecg-forte: rgba(240, 98, 143, .20);
    --novo: #6E9BEE; --aprendendo: #EE7A45; --revisar: #9DB63E; --jovem: #1A9E9E; --maduro: #8A9E2B; --novamente: #F07373;
    --sombra: 0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fundo: #141016; --superficie: #1D1820; --superficie-2: #251F29; --tinta: #F3EEF4; --tinta-2: #ABA0AF; --tinta-3: #7D7281;
  --linha: #352D39; --pulso: #F0628F; --pulso-forte: #F58DAE; --pulso-suave: #2C1822;
  --grade-ecg: rgba(240, 98, 143, .10); --grade-ecg-forte: rgba(240, 98, 143, .20);
  --novo: #6E9BEE; --aprendendo: #EE7A45; --revisar: #9DB63E; --jovem: #1A9E9E; --maduro: #8A9E2B; --novamente: #F07373;
  --sombra: 0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--fundo); color: var(--tinta);
  font: 16px/1.5 var(--f); font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--pulso); }
:focus-visible { outline: 2px solid var(--pulso); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; line-height: 1.15; letter-spacing: -0.02em; text-wrap: balance; }
p { margin: 0; }
.ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico-p { width: 18px; height: 18px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- moldura ---------- */
.aviso-demo {
  background: var(--pulso-suave); color: var(--tinta); font-size: 13px; text-align: center;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
}
.miolo {
  max-width: 1040px; margin: 0 auto;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
}
.topo { padding-top: max(14px, env(safe-area-inset-top, 0px)); }
.topo .miolo { display: flex; align-items: center; gap: 12px; min-height: 64px; }
.marca { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 21px; letter-spacing: -0.03em; background: none; border: 0; padding: 0; }
.marca .selo-marca { width: 34px; height: 34px; border-radius: 10px; background: var(--pulso); color: #fff; display: grid; place-items: center; }
.marca .selo-marca .ico { width: 22px; height: 22px; stroke-width: 2.2; }
.topo-acoes { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.btn-ico {
  width: 44px; height: 44px; border-radius: var(--r-medio); display: grid; place-items: center;
  background: var(--superficie); border: 1px solid var(--linha); color: var(--tinta); padding: 0;
}
.btn-ico:hover { border-color: var(--tinta-3); }
.btn-ico[aria-pressed="true"] { color: var(--pulso); border-color: color-mix(in srgb, var(--pulso) 45%, var(--linha)); background: var(--pulso-suave); }
.btn-ico[aria-pressed="true"] .ico { fill: currentColor; }
.nav-alto { display: none; gap: 4px; margin-left: 18px; }
.nav-alto button { border: 0; background: none; padding: 9px 14px; border-radius: 999px; font-weight: 600; color: var(--tinta-2); }
.nav-alto button[aria-current="page"] { background: var(--superficie); color: var(--tinta); box-shadow: inset 0 0 0 1px var(--linha); }
main.miolo { padding-top: 8px; padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }

.nav-baixo {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: color-mix(in srgb, var(--superficie) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--linha);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
}
.nav-baixo button {
  border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 6px 4px;
  font-size: 12px; font-weight: 600; color: var(--tinta-3);
}
.nav-baixo button[aria-current="page"] { color: var(--pulso); }
@media (min-width: 900px) {
  .nav-alto { display: flex; }
  .nav-baixo { display: none; }
  main.miolo { padding-bottom: 64px; }
}

/* ---------- elementos comuns ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--linha); background: var(--superficie); padding: 11px 18px; border-radius: var(--r-medio);
  font-weight: 700; text-decoration: none; color: var(--tinta); min-height: 44px;
}
.btn:hover { border-color: var(--tinta-3); }
.btn-primario { background: var(--pulso); border-color: var(--pulso); color: #fff; }
:root[data-theme="dark"] .btn-primario { color: #1A0E14; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-primario { color: #1A0E14; } }
.btn-primario:hover { background: var(--pulso-forte); border-color: var(--pulso-forte); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-largo { width: 100%; }
.btn-texto { border: 0; background: none; color: var(--pulso); font-weight: 700; padding: 6px 0; }
.caixa { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--r-grande); }
.campo { display: grid; gap: 6px; }
.campo label { font-weight: 600; font-size: 14px; }
.campo input, .campo select {
  border: 1px solid var(--linha); background: var(--superficie); border-radius: var(--r-peq); padding: 12px 14px; width: 100%; min-height: 46px;
}
.campo input:focus, .campo select:focus { outline: 2px solid var(--pulso); outline-offset: 0; border-color: var(--pulso); }
.msg { padding: 11px 14px; border-radius: var(--r-peq); font-size: 14px; }
.msg-erro { background: color-mix(in srgb, var(--novamente) 12%, var(--superficie)); border: 1px solid color-mix(in srgb, var(--novamente) 35%, transparent); }
.msg-ok { background: var(--pulso-suave); border: 1px solid color-mix(in srgb, var(--pulso) 30%, transparent); }
.vazio { color: var(--tinta-2); text-align: center; padding: 40px 16px; }
.sec { margin-top: 30px; }
.sec-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.sec-cab h2 { font-size: 22px; font-weight: 700; }
.sec-cab .contador { color: var(--tinta-3); font-size: 15px; }
.c-novo { color: var(--novo); } .c-apr { color: var(--aprendendo); } .c-rev { color: var(--revisar); }
.zero { color: var(--tinta-3) !important; opacity: .55; }

/* ---------- login ---------- */
.entrada { min-height: calc(100vh - 40px); display: grid; place-items: center; padding: 32px 0; }
.entrada-caixa { width: 100%; max-width: 420px; display: grid; gap: 22px; }
.entrada-caixa > .caixa { padding: 24px; display: grid; gap: 16px; box-shadow: var(--sombra); }
.entrada h1 { font-size: clamp(32px, 7vw, 42px); font-weight: 800; }
.entrada .sub { color: var(--tinta-2); margin-top: 6px; }
.chips-estaticos { display: flex; flex-wrap: wrap; gap: 6px; }
.chips-estaticos span { font-size: 13px; border: 1px solid var(--linha); border-radius: 999px; padding: 4px 11px; color: var(--tinta-2); background: var(--superficie); }

/* ---------- início ---------- */
.saudacao { margin-top: 18px; }
.saudacao h1 { font-size: clamp(34px, 8vw, 46px); font-weight: 800; }
.saudacao p { color: var(--tinta-2); font-size: 18px; margin-top: 6px; }

.hoje {
  margin-top: 22px; border-radius: var(--r-grande); overflow: hidden; position: relative;
  border: 1px solid color-mix(in srgb, var(--pulso) 22%, var(--linha));
  background-color: var(--pulso-suave);
  background-image:
    linear-gradient(var(--grade-ecg-forte) 1px, transparent 1px),
    linear-gradient(90deg, var(--grade-ecg-forte) 1px, transparent 1px),
    linear-gradient(var(--grade-ecg) 1px, transparent 1px),
    linear-gradient(90deg, var(--grade-ecg) 1px, transparent 1px);
  background-size: 40px 40px, 40px 40px, 8px 8px, 8px 8px;
  background-position: -1px -1px;
}
.hoje-in { position: relative; padding: 20px 20px 18px; display: grid; gap: 14px; }
.hoje-topo { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.hoje-topo strong { font-size: 15px; font-weight: 700; color: var(--pulso-forte); display: flex; align-items: center; gap: 6px; }
.hoje-topo span { font-size: 13px; color: var(--tinta-2); }
.contagens-grandes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.contagens-grandes div { display: grid; gap: 0; }
.contagens-grandes b { font-size: clamp(34px, 9vw, 44px); font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.contagens-grandes span { font-size: 14px; font-weight: 600; color: var(--tinta-2); margin-top: 6px; }
.tracado { display: block; width: 100%; height: 70px; margin: -4px 0 -2px; }
.tracado path { fill: none; stroke: var(--pulso); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.tracado .dia-vazio { stroke: color-mix(in srgb, var(--pulso) 45%, transparent); }
.tracado text { font-size: 10px; fill: var(--tinta-2); font-family: var(--f); }
@media (prefers-reduced-motion: no-preference) {
  .tracado path.anima { stroke-dasharray: var(--comp); stroke-dashoffset: var(--comp); animation: desenhar 2.4s ease-out .15s forwards; }
  @keyframes desenhar { to { stroke-dashoffset: 0; } }
}

.busca-linha { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; margin-top: 18px; }
.busca-campo { position: relative; }
.busca-campo .ico { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--pulso); pointer-events: none; }
.busca-campo input {
  width: 100%; height: 56px; border-radius: var(--r-grande); border: 1px solid var(--linha); background: var(--superficie);
  padding: 0 16px 0 52px; font-size: 16px;
}
.busca-campo input::placeholder { color: var(--tinta-3); }
.busca-campo input:focus { outline: 2px solid var(--pulso); outline-offset: 0; }
.busca-linha .btn-ico { width: 56px; height: 56px; border-radius: var(--r-grande); color: var(--pulso); }

.card-dia { margin-top: 14px; padding: 18px 18px 16px; display: grid; gap: 8px; text-align: left; width: 100%; }
.card-dia-topo { display: flex; align-items: center; gap: 10px; }
.card-dia-topo .marcador { width: 34px; height: 34px; border-radius: 10px; background: var(--pulso-suave); color: var(--pulso); display: grid; place-items: center; }
.card-dia-topo strong { color: var(--pulso); font-size: 15px; flex: 1; }
.card-dia-topo .btn-ico { width: 40px; height: 40px; background: var(--pulso-suave); border-color: transparent; color: var(--pulso); }
.card-dia .pergunta { font-size: 19px; font-weight: 700; line-height: 1.35; }
.card-dia .resposta { color: var(--tinta-2); border-top: 1px dashed var(--linha); padding-top: 10px; }
.card-dia .resposta img { max-width: 100%; height: auto; }
.card-dia .rodape { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--tinta-2); }
.card-dia .rodape .btn-texto { font-size: 14px; }
.etiqueta { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--pulso-suave); color: var(--pulso-forte); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 4px; margin: 20px -16px 0; scrollbar-width: none; scroll-snap-type: x proximity; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--linha); background: var(--superficie); color: var(--tinta); border-radius: 999px;
  padding: 10px 18px; font-weight: 600; font-size: 15px; scroll-snap-align: start; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--pulso-suave); border-color: color-mix(in srgb, var(--pulso) 40%, var(--linha)); color: var(--pulso-forte); }

.progresso-geral { padding: 18px; display: grid; gap: 10px; margin-top: 14px; }
.progresso-geral .linha { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.progresso-geral strong { font-size: 17px; }
.progresso-geral .pct { color: var(--pulso); font-weight: 800; font-size: 20px; }
.barra { height: 8px; background: var(--superficie-2); border-radius: 99px; overflow: hidden; display: flex; gap: 2px; }
.barra i { display: block; height: 100%; border-radius: 99px; }
.progresso-geral small { color: var(--tinta-2); font-size: 14px; }

.grade-decks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 700px) { .grade-decks { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .grade-decks { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile {
  position: relative; text-align: left; padding: 14px 14px 12px; min-height: 138px;
  display: grid; grid-template-rows: auto auto 1fr auto; gap: 4px;
}
.tile:hover { border-color: color-mix(in srgb, var(--pulso) 35%, var(--linha)); }
.tile h3 { font-size: clamp(15px, 4vw, 17px); font-weight: 700; line-height: 1.2; overflow-wrap: break-word; hyphens: auto; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile .area-nome { font-size: 13px; color: var(--tinta-2); }
.tile .tile-pe { display: flex; align-items: end; justify-content: space-between; gap: 8px; margin-top: 10px; }
.tile .tile-pe .ico { width: 34px; height: 34px; color: var(--pulso); stroke-width: 1.6; }
.mini-contagens { display: flex; gap: 10px; font-size: 14px; font-weight: 700; }

/* ---------- decks (árvore do Anki) ---------- */
.titulo-pag { margin-top: 18px; display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.titulo-pag h1 { font-size: clamp(30px, 7vw, 38px); font-weight: 800; }
.titulo-pag p { color: var(--tinta-2); margin-top: 4px; }
.arvore { margin-top: 18px; overflow: hidden; }
.arvore-cab, .no {
  display: grid; grid-template-columns: minmax(0, 1fr) 46px 46px 46px; align-items: center; gap: 4px; padding: 0 14px;
}
.arvore-cab { font-size: 12px; font-weight: 700; color: var(--tinta-2); padding-top: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--linha); }
.arvore-cab span:not(:first-child), .no .n { text-align: right; }
.no { min-height: 56px; border-bottom: 1px solid var(--linha); }
.no:last-child { border-bottom: 0; }
.no .n { font-weight: 700; font-size: 15px; }
.no-nome { display: flex; align-items: center; gap: 8px; min-width: 0; border: 0; background: none; padding: 10px 0; text-align: left; }
.no-nome .txt { min-width: 0; overflow-wrap: anywhere; }
.no-area .no-nome { font-weight: 700; font-size: 16px; }
.no-sub .no-nome { padding-left: 34px; font-size: 15px; }
.no-area { background: var(--superficie-2); }
.expandir { width: 26px; height: 26px; border-radius: 8px; border: 0; background: none; display: grid; place-items: center; color: var(--tinta-2); padding: 0; flex: none; }
.expandir .ico { width: 18px; height: 18px; transition: transform .15s; }
.expandir[aria-expanded="true"] .ico { transform: rotate(90deg); }
.no-nome .ico-deck { width: 20px; height: 20px; color: var(--pulso); }
.no-nome:hover .txt { color: var(--pulso); }
.legenda-anki { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--tinta-2); margin-top: 12px; }
.legenda-anki span { display: inline-flex; align-items: center; gap: 6px; }
.legenda-anki i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* ---------- visão geral do deck ---------- */
.voltar { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--tinta-2); font-weight: 600; padding: 8px 0; margin-top: 6px; }
.deck-cab { display: flex; gap: 14px; align-items: center; margin-top: 8px; }
.deck-cab .ic { width: 56px; height: 56px; border-radius: 16px; background: var(--pulso-suave); color: var(--pulso); display: grid; place-items: center; flex: none; }
.deck-cab .ic .ico { width: 30px; height: 30px; }
.deck-cab h1 { font-size: clamp(26px, 6vw, 34px); font-weight: 800; }
.deck-cab p { color: var(--tinta-2); font-size: 14px; margin-top: 2px; }
.visao { margin-top: 18px; padding: 22px 20px; display: grid; gap: 18px; }
.visao .contagens-grandes { text-align: center; }
.fatos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.fato { padding: 14px; display: grid; gap: 2px; }
.fato b { font-size: 22px; font-weight: 800; }
.fato span { font-size: 13px; color: var(--tinta-2); }
.dica { font-size: 13px; color: var(--tinta-2); text-align: center; }

/* ---------- estudo ---------- */
.estudo { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; padding-top: max(10px, env(safe-area-inset-top, 0px)); }
.estudo-topo { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.estudo-topo .titulo { font-weight: 700; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.restantes { display: flex; justify-content: center; gap: 14px; font-size: 18px; font-weight: 800; }
.restantes span { padding-bottom: 2px; border-bottom: 2px solid transparent; }
.restantes span.atual { border-bottom-color: currentColor; }
.prog-sessao { height: 4px; background: var(--superficie-2); border-radius: 99px; overflow: hidden; }
.prog-sessao i { display: block; height: 100%; background: var(--pulso); transition: width .3s; }
.card {
  position: relative; min-height: min(56vh, 460px); padding: clamp(24px, 5vw, 44px);
  font-size: clamp(19px, 2.6vw, 22px); line-height: 1.6; box-shadow: var(--sombra);
  user-select: none; -webkit-user-select: none; overflow-wrap: anywhere;
}
.card .marca-dagua { position: absolute; inset: 0; pointer-events: none; opacity: .06; border-radius: var(--r-grande); }
.card-conteudo { position: relative; text-align: center; padding-top: 14px; }
.card-conteudo img { max-width: 100%; height: auto; border-radius: 8px; margin: 8px auto; display: block; -webkit-user-drag: none; }
.card-conteudo hr, .card-conteudo hr#answer { border: 0; border-top: 1px dashed var(--linha); margin: 24px 0; }
.card-conteudo .cloze { color: var(--pulso); font-weight: 700; }
.card-conteudo table { margin: 10px auto; border-collapse: collapse; font-size: .9em; }
.card-conteudo td, .card-conteudo th { border: 1px solid var(--linha); padding: 4px 8px; }
.card-conteudo ul, .card-conteudo ol { text-align: left; display: inline-block; margin: 8px 0; }
.card-conteudo details.hint { margin-top: 14px; font-size: .9em; color: var(--tinta-2); }
.card-conteudo details.hint summary { cursor: pointer; color: var(--pulso); font-weight: 700; }
.tipo-card { position: absolute; top: 14px; left: 16px; font-size: 12px; font-weight: 700; }
.acoes { display: grid; gap: 8px; position: sticky; bottom: 0; padding: 8px 0 calc(10px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--fundo) 30%); }
.mostrar { width: 100%; min-height: 56px; font-size: 17px; }
.respostas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.resp {
  display: grid; gap: 2px; justify-items: center; padding: 8px 4px 10px; border-radius: var(--r-medio); min-height: 60px;
  border: 1px solid var(--linha); background: var(--superficie); font-weight: 700; font-size: 15px;
}
.resp small { font-weight: 600; font-size: 12px; color: var(--tinta-2); }
.resp[data-nota="1"] { color: var(--novamente); } .resp[data-nota="2"] { color: var(--tinta-2); }
.resp[data-nota="3"] { color: var(--revisar); }   .resp[data-nota="4"] { color: var(--novo); }
.resp:hover { border-color: currentColor; }
.atalhos { font-size: 12px; color: var(--tinta-3); text-align: center; }
.atalhos kbd { font-family: inherit; border: 1px solid var(--linha); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; font-size: 11px; }
@media (hover: none) { .atalhos { display: none; } }
.fim { text-align: center; padding: 44px 20px; display: grid; gap: 14px; justify-items: center; margin-top: 24px; }
.fim h2 { font-size: 28px; font-weight: 800; }
.fim p { color: var(--tinta-2); max-width: 46ch; }

/* ---------- busca ---------- */
.resultados { margin-top: 14px; overflow: hidden; }
.resultado { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 14px 8px 14px 16px; border-bottom: 1px solid var(--linha); }
.resultado:last-child { border-bottom: 0; }
.resultado .abrir { border: 0; background: none; text-align: left; padding: 0; display: grid; gap: 4px; min-width: 0; }
.resultado .caminho { font-size: 12px; color: var(--tinta-2); }
.resultado .frente { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.estado { font-size: 12px; font-weight: 700; }
.resultado .btn-ico { border: 0; background: none; color: var(--tinta-3); }
.resultado .btn-ico[aria-pressed="true"] { color: var(--pulso); background: none; }
.folha-fundo { position: fixed; inset: 0; z-index: 30; background: rgba(20, 12, 18, .45); display: grid; align-items: end; justify-items: center; }
.folha {
  width: 100%; max-width: 680px; max-height: 88vh; overflow: auto; background: var(--fundo);
  border-radius: 24px 24px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px;
}
@media (min-width: 700px) { .folha-fundo { align-items: center; } .folha { border-radius: 24px; } }
.folha-topo { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.folha-topo span { font-size: 13px; color: var(--tinta-2); }
.folha .card { min-height: 0; }

/* ---------- estatísticas ---------- */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
@media (min-width: 700px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi { padding: 16px; display: grid; gap: 2px; }
.kpi b { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
.kpi span { font-size: 14px; color: var(--tinta-2); }
.grafico { padding: 18px; margin-top: 14px; }
.grafico h2 { font-size: 18px; font-weight: 700; }
.grafico .nota { font-size: 13px; color: var(--tinta-2); margin-top: 2px; }
.grafico svg.plot { width: 100%; height: auto; display: block; margin-top: 14px; overflow: visible; }
.grafico svg.plot text { fill: var(--tinta-2); font-family: var(--f); font-size: 11px; }
.grafico svg.plot .alvo:hover + .marca-h, .grafico svg.plot rect.cel:hover { stroke: var(--tinta); stroke-width: 1.5; }
.legenda { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; font-size: 13px; color: var(--tinta-2); }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legenda b { color: var(--tinta); }
.rolagem { overflow-x: auto; }
table.tab { width: 100%; border-collapse: collapse; font-size: 15px; }
table.tab th { text-align: left; font-size: 13px; color: var(--tinta-2); font-weight: 600; padding: 10px 16px; border-bottom: 1px solid var(--linha); }
table.tab td { padding: 12px 16px; border-bottom: 1px solid var(--linha); }
table.tab tr:last-child td { border-bottom: 0; }
table.tab .dir { text-align: right; }
.selo { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
.selo-bom { background: color-mix(in srgb, var(--revisar) 16%, transparent); color: var(--revisar); }
.selo-medio { background: color-mix(in srgb, var(--aprendendo) 16%, transparent); color: var(--aprendendo); }
.selo-ruim { background: color-mix(in srgb, var(--novamente) 16%, transparent); color: var(--novamente); }
.dica-flutuante {
  position: fixed; z-index: 40; pointer-events: none; background: var(--tinta); color: var(--fundo);
  font-size: 13px; padding: 6px 10px; border-radius: 8px; box-shadow: var(--sombra); white-space: nowrap;
}

/* ---------- perfil ---------- */
.perfil { display: grid; gap: 14px; max-width: 680px; margin-top: 18px; }
.perfil .caixa { padding: 20px; display: grid; gap: 12px; }
.perfil h2 { font-size: 18px; font-weight: 700; }
.linha-info { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--linha); padding-top: 10px; }
.linha-info:first-of-type { border-top: 0; padding-top: 0; }
.linha-info span:first-child { color: var(--tinta-2); }
.segmentado { display: inline-grid; grid-auto-flow: column; background: var(--superficie-2); border-radius: 12px; padding: 4px; gap: 4px; }
.segmentado button { border: 0; background: none; padding: 8px 14px; border-radius: 9px; font-weight: 600; color: var(--tinta-2); }
.segmentado button[aria-pressed="true"] { background: var(--superficie); color: var(--tinta); box-shadow: var(--sombra); }
.disp { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--linha); padding-top: 10px; }
.disp div { min-width: 0; overflow-wrap: anywhere; }
.texto-2 { color: var(--tinta-2); font-size: 14px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  background: var(--tinta); color: var(--fundo); padding: 11px 16px; border-radius: 12px; font-size: 14px; box-shadow: var(--sombra);
  max-width: calc(100% - 32px);
}
@media (min-width: 900px) { .toast { bottom: 24px; } }
/* ---------- criar decks e editar cards ---------- */
.acoes-topo { display: flex; gap: 8px; flex-wrap: wrap; }
.campo textarea {
  border: 1px solid var(--linha); background: var(--superficie); border-radius: var(--r-peq); padding: 12px 14px; width: 100%;
  min-height: 96px; resize: vertical; font: inherit; color: inherit; line-height: 1.5;
}
.campo textarea:focus { outline: 2px solid var(--pulso); outline-offset: 0; border-color: var(--pulso); }
.folha h2 { font-size: 20px; font-weight: 700; }
.folha .botoes { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.escolha { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; border: 0; border-bottom: 1px solid var(--linha); background: none; font-weight: 600; }
.escolha:last-child { border-bottom: 0; }
.escolha .ico { color: var(--pulso); }
.escolha small { margin-left: auto; color: var(--tinta-2); font-weight: 500; }
.convite { padding: 18px; display: grid; gap: 10px; margin-top: 14px; }
.convite p { color: var(--tinta-2); }
.card-item { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px; align-items: center; padding: 12px 8px 12px 16px; border-bottom: 1px solid var(--linha); }
.card-item:last-child { border-bottom: 0; }
.card-item .frente { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-item .btn-ico, .resultado .btn-ico { border: 0; background: none; color: var(--tinta-3); }
.card-item .btn-ico:hover, .resultado .btn-ico:hover { color: var(--pulso); }
.res-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 14px 16px 8px; font-weight: 700; border-bottom: 1px solid var(--linha); }
.res-cab span { color: var(--tinta-3); font-weight: 500; font-size: 14px; }
.deck-achado { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 12px; align-items: center; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--linha); background: none; padding: 12px 16px; }
.deck-achado .ic { width: 38px; height: 38px; border-radius: 11px; background: var(--pulso-suave); color: var(--pulso); display: grid; place-items: center; }
.deck-achado .ic .ico { width: 20px; height: 20px; }
.deck-achado strong { display: block; }
.deck-achado small { color: var(--tinta-2); font-size: 13px; }
.deck-achado > .ico { color: var(--tinta-3); width: 18px; height: 18px; }
.deck-achado:hover strong { color: var(--pulso); }
.mais-res { width: 100%; border: 0; border-bottom: 1px solid var(--linha); background: none; color: var(--pulso); font-weight: 700; padding: 12px 16px; text-align: left; }

/* ---------- teste grátis e planos ---------- */
.faixa-teste { background: var(--pulso-suave); border-bottom: 1px solid color-mix(in srgb, var(--pulso) 20%, var(--linha)); }
.faixa-teste .miolo { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 2px 12px; min-height: 44px; padding-top: 8px; padding-bottom: 8px; font-size: 14px; }
.faixa-teste strong { color: var(--pulso-forte); }
.faixa-teste .btn-texto { font-size: 14px; white-space: nowrap; text-decoration: underline; text-underline-offset: 3px; padding: 2px 0; }
.faixa-teste .miolo > span { white-space: nowrap; }
.planos { display: grid; gap: 14px; margin-top: 18px; }
@media (min-width: 760px) { .planos { grid-template-columns: 1fr 1fr; align-items: start; } }
.plano { padding: 22px 20px; display: grid; gap: 12px; position: relative; }
.plano-destaque { border: 2px solid var(--pulso); box-shadow: var(--sombra); }
.plano .selo-economia { position: absolute; top: -12px; right: 16px; background: var(--pulso); color: #fff; font-size: 13px; font-weight: 800; padding: 4px 12px; border-radius: 999px; }
:root[data-theme="dark"] .plano .selo-economia { color: #1A0E14; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .plano .selo-economia { color: #1A0E14; } }
.plano h2 { font-size: 20px; font-weight: 700; }
.preco { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.preco s { color: var(--tinta-3); font-size: 17px; }
.preco b { font-size: 44px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.preco span { color: var(--tinta-2); }
.plano .equivale { color: var(--tinta-2); font-size: 14px; }
.plano .equivale strong { color: var(--revisar); }
.inclui { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.inclui li { display: flex; gap: 10px; align-items: flex-start; }
.inclui li .ico { color: var(--revisar); width: 20px; height: 20px; margin-top: 2px; }
.aguardando { padding: 16px; display: flex; gap: 12px; align-items: center; margin-top: 14px; }
.aguardando .pontinho { width: 10px; height: 10px; border-radius: 99px; background: var(--pulso); flex: none; animation: pulsar 1.2s ease-in-out infinite; }
@keyframes pulsar { 50% { opacity: .3; transform: scale(.8); } }
.plano-atual { padding: 18px 20px; display: grid; gap: 6px; margin-top: 18px; }

/* ---------- transições ---------- */
.ocupado-leve { opacity: .6; transition: opacity .15s ease; }
#tela.ocupado { opacity: .5; pointer-events: none; transition: opacity .15s ease; }
.vazio.carregando { opacity: 0; animation: aparecer .2s ease .35s forwards; }
@keyframes aparecer { to { opacity: 1; } }
@media (prefers-reduced-motion: no-preference) {
  #tela.entrando > * { animation: entrar .32s cubic-bezier(.2, .8, .2, 1) both; }
  #tela.entrando > *:nth-child(2) { animation-delay: .03s; }
  #tela.entrando > *:nth-child(3) { animation-delay: .06s; }
  #tela.entrando > *:nth-child(4) { animation-delay: .09s; }
  #tela.entrando > *:nth-child(5) { animation-delay: .12s; }
  #tela.entrando > *:nth-child(n+6) { animation-delay: .15s; }
  @keyframes entrar { from { opacity: 0; transform: translateY(10px); } }
  .folha-fundo { animation: escurecer .2s ease-out both; }
  .folha { animation: subir .3s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes escurecer { from { background: transparent; } }
  @keyframes subir { from { opacity: 0; transform: translateY(36px); } }
  .card-conteudo.virando { animation: virar .26s ease-out both; }
  @keyframes virar { from { opacity: 0; transform: translateY(6px); } }
  .nav-baixo button .ico { transition: transform .2s ease; }
  .nav-baixo button[aria-current="page"] .ico { transform: translateY(-2px) scale(1.06); }
  .chip, .btn, .btn-ico, .tile, .resp { transition: background-color .15s ease, border-color .15s ease, color .15s ease, transform .1s ease; }
  .tile:active, .btn:active, .resp:active, .chip:active { transform: scale(.98); }
  #tela.entrando .tracado path.anima { animation-delay: .25s; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<script>
"use strict";
/* =====================================================================
   REVISÃO ESPAÇADA (variação do SM-2, mesma lógica-base do Anki)
   ===================================================================== */
const SRS = (() => {
  const MIN = 60 * 1000, DIA = 86400 * 1000;
  const inicioDoDia = (ms) => { const d = new Date(ms); d.setHours(4, 0, 0, 0); return d.getTime(); };

  function proximo(c, nota, agora = Date.now()) {
    let { ease = 2.5, intervalo = 0, repeticoes = 0, lapsos = 0, estado = "aprendendo" } = c;
    let venc;
    if (estado === "aprendendo") {
      if (nota === 1) venc = agora + 1 * MIN;
      else if (nota === 2) venc = agora + 6 * MIN;
      else {
        intervalo = nota === 4 ? Math.max(4, intervalo) : Math.max(1, intervalo);
        if (nota === 4) ease += 0.15;
        repeticoes += 1; estado = "revisao";
        venc = inicioDoDia(agora + intervalo * DIA);
      }
    } else {
      if (nota === 1) {
        lapsos += 1; ease = Math.max(1.3, ease - 0.2);
        intervalo = Math.max(1, Math.round(intervalo * 0.2));
        estado = "aprendendo"; venc = agora + 10 * MIN;
      } else {
        if (nota === 2) { intervalo = Math.max(intervalo + 1, Math.round(intervalo * 1.2)); ease = Math.max(1.3, ease - 0.15); }
        if (nota === 3) { intervalo = Math.max(intervalo + 1, Math.round(intervalo * ease)); }
        if (nota === 4) { intervalo = Math.max(intervalo + 1, Math.round(intervalo * ease * 1.3)); ease += 0.15; }
        intervalo = Math.min(intervalo, CONFIG.INTERVALO_MAXIMO_DIAS);
        repeticoes += 1;
        venc = inicioDoDia(agora + intervalo * DIA);
      }
    }
    return { ease: Math.round(ease * 100) / 100, intervalo, repeticoes, lapsos, estado, vencimento: new Date(venc).toISOString() };
  }

  function rotulo(c, nota) {
    const r = proximo(c, nota);
    const ms = new Date(r.vencimento).getTime() - Date.now();
    if (ms < 60 * MIN) return `${Math.max(1, Math.round(ms / MIN))} min`;
    const d = r.intervalo;
    if (d < 31) return `${d} d`;
    if (d < 365) return `${(d / 30).toFixed(d < 300 ? 1 : 0).replace(".", ",")} m`;
    return `${(d / 365).toFixed(1).replace(".", ",")} a`;
  }
  return { proximo, rotulo };
})();
</script>

<script>
"use strict";
/* =====================================================================
   CAMADA DE DADOS — duas implementações com a mesma interface
   ===================================================================== */
const MODO_DEMO = !CONFIG.SUPABASE_URL;
const guardar = {
  ler(k, padrao) { try { const v = localStorage.getItem(k); return v == null ? padrao : JSON.parse(v); } catch { return padrao; } },
  gravar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* armazenamento indisponível */ } },
  apagar(k) { try { localStorage.removeItem(k); } catch { /* idem */ } },
};
function idDispositivo() {
  let id = guardar.ler("mf_dispositivo", null);
  if (!id) { id = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); guardar.gravar("mf_dispositivo", id); }
  return id;
}
function descreverAparelho() {
  const ua = navigator.userAgent;
  const so = /Android/i.test(ua) ? "Android" : /iPhone|iPad/i.test(ua) ? "iPhone/iPad" : /Windows/i.test(ua) ? "Windows" : /Mac/i.test(ua) ? "Mac" : /Linux/i.test(ua) ? "Linux" : "Aparelho";
  const nav = /Edg\//.test(ua) ? "Edge" : /Chrome\//.test(ua) ? "Chrome" : /Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : "Navegador";
  return `${nav} em ${so}`;
}

// ---------- Supabase ----------
function criarApiSupabase(sb) {
  const erro = (e) => { if (e) throw new Error(e.message || String(e)); };
  const rpc = async (nome, args) => { const { data, error } = await sb.rpc(nome, args); erro(error); return data; };
  return {
    async sessao() { const { data } = await sb.auth.getSession(); return data.session; },
    async entrar(email, senha) {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
      if (error) throw new Error(/invalid/i.test(error.message) ? "E-mail ou senha incorretos." : error.message);
      return data.session;
    },
    async sair() { await sb.auth.signOut(); },
    async enviarRecuperacao(email) {
      const url = location.origin + location.pathname + "?definir=1";
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: url }); erro(error);
    },
    async definirSenha(senha) { const { error } = await sb.auth.updateUser({ password: senha }); erro(error); },
    async assinatura() { return (await rpc("minha_situacao"))?.[0] ?? null; },
    async cadastrar(nome, email, senha) {
      const { data, error } = await sb.auth.signUp({ email, password: senha, options: { data: { nome }, emailRedirectTo: location.origin + location.pathname } });
      if (error) throw new Error(/registered|already/i.test(error.message) ? "Já existe uma conta com este e-mail. Entre ou recupere a senha." : /password/i.test(error.message) ? "A senha precisa ter pelo menos 8 caracteres." : error.message);
      if (data.user && Array.isArray(data.user.identities) && !data.user.identities.length) throw new Error("Já existe uma conta com este e-mail. Entre ou recupere a senha.");
      return data.session;
    },
    decks: () => rpc("painel_decks"),
    fila: (ids, novos) => rpc("fila_estudo", { p_decks: ids, p_novos_por_dia: novos }),
    filaFavoritos: () => rpc("fila_favoritos"),
    async responder(card, nota, r) {
      await rpc("responder_card", {
        p_card: card.card_id, p_nota: nota, p_ease: r.ease, p_intervalo: r.intervalo, p_repeticoes: r.repeticoes,
        p_lapsos: r.lapsos, p_estado: r.estado, p_vencimento: r.vencimento,
      });
    },
    buscar: (termo, soFav) => rpc("buscar_cards", { p_termo: termo, p_somente_favoritos: soFav }),
    async cardDoDia(salto) { return (await rpc("card_do_dia", { p_salto: salto }))?.[0] ?? null; },
    async favoritosIds() { const { data, error } = await sb.from("favoritos").select("card_id").eq("ativo", true); erro(error); return new Set(data.map((f) => f.card_id)); },
    alternarFavorito: (id) => rpc("alternar_favorito", { p_card: id }),
    estatisticas: () => rpc("minhas_estatisticas", { p_dias: 30 }),
    porDia: (dias = 30) => rpc("revisoes_por_dia", { p_dias: dias }),
    previsao: () => rpc("previsao_revisoes", { p_dias: 30 }),
    async estados() { return (await rpc("contagem_estados"))?.[0] ?? { novos: 0, aprendendo: 0, jovens: 0, maduros: 0 }; },
    async registrarDispositivo() { await rpc("registrar_dispositivo", { p_dispositivo: idDispositivo(), p_descricao: descreverAparelho() }); },
    async dispositivoValido() { const { data, error } = await sb.rpc("dispositivo_valido", { p_dispositivo: idDispositivo() }); if (error) return true; return data; },
    async dispositivos() { const { data, error } = await sb.from("dispositivos").select("*").order("ultimo_acesso", { ascending: false }); erro(error); return data; },
    async removerDispositivo(id) { const { error } = await sb.from("dispositivos").delete().eq("dispositivo", id); erro(error); },
    criarDeck: (titulo) => rpc("criar_deck", { p_titulo: titulo }),
    renomearDeck: (id, titulo) => rpc("renomear_deck", { p_deck: id, p_titulo: titulo }),
    arquivarDeck: (id) => rpc("arquivar_deck", { p_deck: id }),
    salvarCard: (deck, card, frente, verso) => rpc("salvar_card", { p_deck: deck, p_card: card, p_frente: frente, p_verso: verso }),
    excluirCard: (id) => rpc("excluir_card", { p_card: id }),
    copiarCard: (card, deck) => rpc("copiar_card", { p_card: card, p_deck: deck }),
    async cardsDoDeck(id) { const { data, error } = await sb.from("cards").select("id, frente, verso").eq("deck_id", id).order("ordem"); erro(error); return data; },
  };
}

// ---------- Demonstração (em memória + localStorage) ----------
function criarApiDemo() {
  const decks = [], cards = [];
  DEMO_DECKS.forEach((d, i) => {
    const id = "deck-" + i;
    decks.push({ id, nome: d.nome, descricao: null });
    d.cards.forEach((c, j) => {
      if (c[0] === "cloze") {
        const nums = [...new Set([...c[1].matchAll(/\{\{c(\d+)::/g)].map((m) => +m[1]))];
        nums.forEach((n) => {
          const r = (lado) => c[1].replace(/\{\{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g, (_, k, resp, dica) =>
            +k !== n ? resp : lado === "q" ? `<span class="cloze">[${dica || "..."}]</span>` : `<span class="cloze">${resp}</span>`);
          cards.push({ card_id: `c-${i}-${j}-${n}`, deck_id: id, frente: r("q"), verso: r("a") });
        });
      } else {
        cards.push({ card_id: `c-${i}-${j}`, deck_id: id, frente: c[0], verso: `${c[0]}<hr id="answer">${c[1]}` });
      }
    });
  });
  // Decks e cards criados pelo aluno (guardados neste navegador)
  const pessoais = guardar.ler("pm_demo_pessoais", { decks: [], cards: [] });
  pessoais.decks.forEach((d) => decks.push(d));
  pessoais.cards.forEach((c) => cards.push(c));
  const salvarPessoais = () => guardar.gravar("pm_demo_pessoais", {
    decks: decks.filter((d) => d.dono), cards: cards.filter((c) => decks.find((d) => d.id === c.deck_id)?.dono),
  });
  const nomeDe = (d) => d.dono ? `Meus decks::${d.titulo}` : d.nome;
  const meu = (id) => { const d = decks.find((x) => x.id === id && x.dono && x.publicado !== false); if (!d) throw new Error("Deck não encontrado."); return d; };
  let prog = guardar.ler("pm_demo_prog", null);
  let hist = guardar.ler("pm_demo_hist", null);
  let favs = new Set(guardar.ler("pm_demo_favs", []));
  const DIA = 86400000;
  if (!prog || !hist) {
    // Progresso e histórico de exemplo para as telas não abrirem vazias
    prog = {}; hist = [];
    cards.forEach((c, k) => {
      if (k % 3 === 2) return;
      const intervalo = [1, 3, 8, 25, 40, 2, 12][k % 7];
      const venc = k % 4 === 0 ? Date.now() - 3600000 : Date.now() + ((k % 9) + 1) * DIA;
      prog[c.card_id] = { ease: 2.5, intervalo, repeticoes: 3, lapsos: 0, estado: k % 11 === 0 ? "aprendendo" : "revisao", vencimento: new Date(venc).toISOString(), criado: Date.now() - 20 * DIA };
    });
    for (let d = 110; d >= 1; d--) {
      if ((d * 7) % 5 === 0 || (d > 60 && d % 3 === 0)) continue;
      const n = 6 + ((d * 13) % 34);
      for (let k = 0; k < n; k++) {
        const card = cards[(d * 3 + k) % cards.length];
        hist.push({ card_id: card.card_id, deck_id: card.deck_id, nota: (k + d) % 6 === 0 ? 1 : (k % 7 === 0 ? 2 : 3), em: Date.now() - d * DIA + k * 60000 });
      }
    }
    favs = new Set([cards[0].card_id, cards[5].card_id]);
  }
  const salvar = () => { guardar.gravar("pm_demo_prog", prog); guardar.gravar("pm_demo_hist", hist); guardar.gravar("pm_demo_favs", [...favs]); };
  salvar();
  const hoje0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const chaveDia = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  let logado = guardar.ler("mf_demo_sessao", null);
  const dispositivos = [{ dispositivo: idDispositivo(), descricao: descreverAparelho(), ultimo_acesso: new Date().toISOString() }];
  const deckNome = (id) => { const d = decks.find((x) => x.id === id); return d ? nomeDe(d) : ""; };
  const comoFila = (c, novo) => ({ ...c, novo, ...(novo ? { ease: 2.5, intervalo: 0, repeticoes: 0, lapsos: 0, estado: "aprendendo" } : prog[c.card_id]) });

  return {
    async sessao() { return logado; },
    async entrar(email, senha) {
      if (!email || !senha) throw new Error("Informe e-mail e senha.");
      logado = { user: { email, user_metadata: { nome: "Pedro" } } }; guardar.gravar("mf_demo_sessao", logado); return logado;
    },
    async sair() { logado = null; guardar.apagar("mf_demo_sessao"); },
    async enviarRecuperacao() {},
    async definirSenha() {},
    async assinatura() {
      // Demonstração: teste grátis em andamento (troque por guardar.gravar("pm_demo_plano","mensal") para simular assinante)
      const plano = guardar.ler("pm_demo_plano", null);
      if (plano) return { status: "ativa", plano, expira_em: new Date(Date.now() + 23 * DIA).toISOString(), assinante: true, em_teste: false, acesso: true };
      const teste = new Date(guardar.ler("pm_demo_criado", Date.now()) + CONFIG.HORAS_TESTE * 3600000).toISOString();
      return { status: null, plano: null, expira_em: null, assinante: false, em_teste: new Date(teste) > Date.now(), teste_ate: teste, acesso: new Date(teste) > Date.now() };
    },
    async cadastrar(nome, email, senha) {
      if (!email || (senha || "").length < 8) throw new Error("Informe e-mail e uma senha com pelo menos 8 caracteres.");
      guardar.gravar("pm_demo_criado", Date.now());
      logado = { user: { email, user_metadata: { nome } } }; guardar.gravar("mf_demo_sessao", logado); return logado;
    },
    async decks() {
      const agora = Date.now();
      return decks.filter((d) => d.publicado !== false).sort((a, b) => (b.dono ? 1 : 0) - (a.dono ? 1 : 0)).map((d) => {
        const doDeck = cards.filter((c) => c.deck_id === d.id);
        const p = doDeck.map((c) => prog[c.card_id]).filter(Boolean);
        return { ...d, nome: nomeDe(d), total: doDeck.length, estudados: p.length,
          aprendendo: p.filter((x) => x.estado === "aprendendo" && new Date(x.vencimento) <= agora).length,
          revisar: p.filter((x) => x.estado === "revisao" && new Date(x.vencimento) <= agora).length,
          maduros: p.filter((x) => x.intervalo >= 21).length,
          novos_hoje: p.filter((x) => x.criado >= hoje0()).length };
      });
    },
    async fila(ids, novos) {
      const agora = Date.now();
      const vencidos = cards.filter((c) => ids.includes(c.deck_id) && prog[c.card_id] && new Date(prog[c.card_id].vencimento).getTime() <= agora).map((c) => comoFila(c, false));
      const introduzidos = cards.filter((c) => ids.includes(c.deck_id) && prog[c.card_id]?.criado >= hoje0()).length;
      const novosLista = cards.filter((c) => ids.includes(c.deck_id) && !prog[c.card_id]).slice(0, Math.max(0, novos - introduzidos)).map((c) => comoFila(c, true));
      return [...vencidos, ...novosLista];
    },
    async filaFavoritos() { return cards.filter((c) => favs.has(c.card_id)).map((c) => comoFila(c, !prog[c.card_id])); },
    async responder(card, nota, r) {
      prog[card.card_id] = { ...r, criado: prog[card.card_id]?.criado ?? Date.now() };
      hist.push({ card_id: card.card_id, deck_id: card.deck_id, nota, em: Date.now() });
      salvar();
    },
    async buscar(termo, soFav) {
      const t = (termo || "").toLowerCase();
      return cards.filter((c) => (!soFav || favs.has(c.card_id)) && (!t || (c.frente + c.verso + deckNome(c.deck_id)).toLowerCase().includes(t)))
        .slice(0, 60).map((c) => ({ ...c, deck: deckNome(c.deck_id), favorito: favs.has(c.card_id), estado: prog[c.card_id]?.estado ?? null, vencimento: prog[c.card_id]?.vencimento ?? null, intervalo: prog[c.card_id]?.intervalo ?? null }));
    },
    async cardDoDia(salto) {
      const semente = Math.floor(Date.now() / DIA) * 31 + salto * 7;
      const c = cards[semente % cards.length];
      return { card_id: c.card_id, deck: deckNome(c.deck_id), frente: c.frente, verso: c.verso };
    },
    async favoritosIds() { return new Set(favs); },
    async alternarFavorito(id) { if (favs.has(id)) favs.delete(id); else favs.add(id); salvar(); return favs.has(id); },
    async estatisticas() {
      const lim = Date.now() - 30 * DIA, por = {};
      for (const h of hist) if (h.em > lim) {
        const p = (por[h.deck_id] ??= { deck_id: h.deck_id, deck: deckNome(h.deck_id), respostas: 0, acertos: 0 });
        p.respostas++; if (h.nota >= 3) p.acertos++;
      }
      return Object.values(por).sort((a, b) => b.respostas - a.respostas);
    },
    async porDia(dias = 30) {
      const por = {};
      for (const h of hist) {
        if (h.em < Date.now() - dias * DIA) continue;
        const k = chaveDia(h.em);
        const p = (por[k] ??= { dia: k, respostas: 0, acertos: 0 }); p.respostas++; if (h.nota >= 3) p.acertos++;
      }
      return Object.values(por).sort((a, b) => a.dia.localeCompare(b.dia));
    },
    async previsao() {
      const por = {};
      for (const p of Object.values(prog)) {
        const v = Math.max(new Date(p.vencimento).getTime(), Date.now());
        if (v > Date.now() + 30 * DIA) continue;
        const k = chaveDia(v); por[k] = (por[k] ?? 0) + 1;
      }
      return Object.entries(por).map(([dia, quantidade]) => ({ dia, quantidade }));
    },
    async estados() {
      const p = Object.values(prog);
      return { novos: cards.length - p.length, aprendendo: p.filter((x) => x.estado === "aprendendo").length,
        jovens: p.filter((x) => x.estado === "revisao" && x.intervalo < 21).length, maduros: p.filter((x) => x.estado === "revisao" && x.intervalo >= 21).length };
    },
    async registrarDispositivo() {},
    async dispositivoValido() { return true; },
    async dispositivos() { return dispositivos; },
    async removerDispositivo() {},
    async criarDeck(titulo) {
      if (!String(titulo || "").trim()) throw new Error("Dê um nome ao deck.");
      const id = "meu-" + Date.now(); decks.push({ id, nome: "pessoal:" + id, titulo: String(titulo).trim().slice(0, 80), dono: true, publicado: true });
      salvarPessoais(); return id;
    },
    async renomearDeck(id, titulo) { if (!String(titulo || "").trim()) throw new Error("Dê um nome ao deck."); meu(id).titulo = String(titulo).trim().slice(0, 80); salvarPessoais(); },
    async arquivarDeck(id) { meu(id).publicado = false; salvarPessoais(); },
    async salvarCard(deck, card, frente, verso) {
      meu(deck); if (!textoPuro(frente)) throw new Error("Escreva a frente do card.");
      if (card) { const c = cards.find((x) => x.card_id === card); Object.assign(c, { frente, verso }); salvarPessoais(); return card; }
      const id = "pc-" + Date.now(); cards.push({ card_id: id, deck_id: deck, frente, verso }); salvarPessoais(); return id;
    },
    async excluirCard(id) { const i = cards.findIndex((c) => c.card_id === id); if (i >= 0) cards.splice(i, 1); delete prog[id]; salvar(); salvarPessoais(); },
    async copiarCard(card, deck) {
      meu(deck); const o = cards.find((c) => c.card_id === card); if (!o) throw new Error("Card não encontrado.");
      const id = "pc-" + Date.now(); cards.push({ card_id: id, deck_id: deck, frente: o.frente, verso: o.verso }); salvarPessoais(); return id;
    },
    async cardsDoDeck(id) { return cards.filter((c) => c.deck_id === id).map((c) => ({ id: c.card_id, frente: c.frente, verso: c.verso })); },
  };
}
</script>

<script>
"use strict";
/* =====================================================================
   INTERFACE
   ===================================================================== */
let api = null, sessao = null, assinatura = null;
const tela = document.getElementById("tela");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtData = (iso) => iso ? new Date(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" }) : "—";
const novosPorDia = () => guardar.ler("mf_novos_dia", CONFIG.NOVOS_POR_DIA_PADRAO);
const ico = (nome, cls = "") => `<svg class="ico ${cls}" aria-hidden="true"><use href="#i-${nome}"/></svg>`;
const N = (v) => Number(v ?? 0);
const semAcento = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const textoPuro = (html) => { const d = document.createElement("div"); d.innerHTML = String(html ?? "").replace(/<hr[^>]*>/gi, " — ").replace(/<br\s*\/?>/gi, " "); return d.textContent.replace(/\s+/g, " ").trim(); };
const caminho = (nome) => String(nome).split("::").join(" › ");
const folhaDoNome = (nome) => String(nome).split("::").at(-1);

const AREAS = ["Meus decks", "Clínica Médica", "Cirurgia", "Pediatria", "Ginecologia e Obstetrícia", "Medicina Preventiva", "Semiologia", "Especialidades", "Ética Médica"];
const ICONES = [
  [/cardio|coracao/, "coracao"], [/pneumo|respirat|pulm/, "pulmao"], [/neuro|psiq/, "cerebro"],
  [/nefro|renal|urin|hemato|sangue/, "gota"], [/gastro|hepat|digest|abdom/, "talher"], [/endocr|diabet|metab|tireo/, "frasco"],
  [/infect|micro|parasit|imuno/, "micro"], [/trauma|urgenc|emerg|queimad/, "curativo"], [/neonat|pediat|puericult|crianc/, "bebe"],
  [/obstet|gineco|gestac|mama/, "gestante"], [/epidem|bioest|estatist/, "grafico"], [/sus\b|saude publ|politic/, "hospital"],
  [/prevent|vigil|vacin|imuniz/, "escudo"], [/etica|direito|sigilo|documento|publicidade|remunera|pericia|auditoria|principios|responsabilidade|relacao/, "livro"],
  [/semiolog|sinais vitais|anamnese|facies|marcha|termos/, "pulso"], [/especialidad|dermato|pele|oftalmo|otorrino|ortop|osteo|psiq/, "esteto"],
  [/ginec|ovario|utero|colo|endometr|mama|vulv|amenorr|anticoncep|ciclo menstr|parto|gemelar|sangramento|puerp/, "gestante"],
  [/cancer|tumor|oncolog/, "micro"], [/neonat|puberdade|aleitamento|crescimento|congenit|exantem/, "bebe"], [/cirurg|hernia|cabeca|torax|vascular/, "bisturi"], [/clinica/, "esteto"], [/^meus decks/, "decks"],
];
const iconeDe = (nome) => { const n = semAcento(nome); for (const [re, i] of ICONES) if (re.test(n)) return i; return "livro"; };

function toast(texto) {
  const t = document.getElementById("toast");
  t.textContent = texto; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 3000);
}

/* ---------- tema ---------- */
function temaAtual() {
  const t = document.documentElement.dataset.theme;
  if (t) return t;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function aplicarTema(t) {
  if (t === "auto") { delete document.documentElement.dataset.theme; guardar.apagar("pm_tema"); }
  else { document.documentElement.dataset.theme = t; guardar.gravar("pm_tema", t); try { localStorage.setItem("pm_tema", t); } catch {} }
  const escuro = temaAtual() === "dark";
  document.querySelector('meta[name="theme-color"]').content = escuro ? "#141016" : "#FBF8F9";
  document.querySelector("#alternar-tema use").setAttribute("href", escuro ? "#i-sol" : "#i-lua");
}
document.getElementById("alternar-tema").addEventListener("click", () => aplicarTema(temaAtual() === "dark" ? "light" : "dark"));

/* ---------- navegação ---------- */
let telaAtual = "inicio";
function marcarNav(nome) {
  document.querySelectorAll("[data-ir]").forEach((b) => {
    if (b.dataset.ir === nome) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
}
document.querySelectorAll("[data-ir]").forEach((b) => b.addEventListener("click", () => ir(b.dataset.ir)));
document.getElementById("ir-inicio").addEventListener("click", () => ir("inicio"));
document.getElementById("ir-perfil").addEventListener("click", () => ir("perfil"));

function mostrarMoldura(sim) {
  document.getElementById("topo").hidden = !sim;
  document.getElementById("nav-baixo").hidden = !sim;
  if (!sim) document.getElementById("faixa-teste").hidden = true;
}
let navegando = false;
function ir(nome, ...args) {
  // Sem assinatura ativa, só o Perfil (para sair ou trocar de conta) fica disponível
  if (!assinatura?.acesso && nome !== "perfil" && nome !== "planos") return telaPlanos({ bloqueado: true });
  document.querySelectorAll(".folha-fundo").forEach((f) => f.remove());
  navegando = true;
  window.scrollTo(0, 0);
  telaAtual = nome;
  const telas = { inicio: telaInicio, decks: telaDecks, deck: telaDeck, busca: telaBusca, stats: telaStats, perfil: telaPerfil, estudo: telaEstudo, planos: telaPlanos };
  mostrarMoldura(nome !== "estudo");
  document.getElementById("faixa-teste").hidden = nome === "estudo" || !assinatura?.em_teste;
  marcarNav({ deck: "decks" }[nome] ?? nome);
  telas[nome](...args);
}
// Ao trocar de tela, o conteúdo anterior fica esmaecido até o novo chegar (sem piscar "Carregando…").
// O aviso de carregamento só aparece se demorar mais de 0,35 s.
const carregando = (txt = "Carregando…") => {
  const atual = tela.firstElementChild;
  if (atual && !atual.classList.contains("carregando")) { tela.classList.add("ocupado"); return; }
  tela.innerHTML = `<div class="vazio carregando">${txt}</div>`;
};
new MutationObserver(() => {
  if (tela.firstElementChild?.classList.contains("carregando")) return;
  tela.classList.remove("ocupado");
  if (!navegando) return;
  navegando = false;
  tela.classList.remove("entrando"); void tela.offsetWidth; tela.classList.add("entrando");
  clearTimeout(tela._anim); tela._anim = setTimeout(() => tela.classList.remove("entrando"), 900);
}).observe(tela, { childList: true });
const falha = (e) => { tela.innerHTML = `<div class="msg msg-erro" style="margin-top:18px">Não foi possível carregar: ${esc(e.message)}. Verifique sua conexão e tente de novo.</div>`; };

/* ---------- decks: agrupamento e contagens no estilo Anki ---------- */
// Lista de decks guardada por 30 s: trocar de aba fica instantâneo
let cacheDecks = null, cacheDecksEm = 0;
async function obterDecks(forcar = false) {
  if (!cacheDecks || (forcar && Date.now() - cacheDecksEm > 30000)) { cacheDecks = await api.decks(); cacheDecksEm = Date.now(); }
  return cacheDecks;
}
const invalidarDecks = () => { cacheDecks = null; };
// Novos disponíveis hoje respeitando o limite diário (como o Anki mostra)
function novosDisponiveis(lista) {
  const restantes = lista.reduce((s, d) => s + Math.max(0, N(d.total) - N(d.estudados)), 0);
  const hoje = lista.reduce((s, d) => s + N(d.novos_hoje), 0);
  return Math.min(restantes, Math.max(0, novosPorDia() - hoje));
}
function contar(lista) {
  return {
    novos: novosDisponiveis(lista),
    aprendendo: lista.reduce((s, d) => s + N(d.aprendendo), 0),
    revisar: lista.reduce((s, d) => s + N(d.revisar), 0),
    total: lista.reduce((s, d) => s + N(d.total), 0),
    estudados: lista.reduce((s, d) => s + N(d.estudados), 0),
    maduros: lista.reduce((s, d) => s + N(d.maduros), 0),
  };
}
function agrupar(lista) {
  const grupos = new Map();
  for (const d of lista) {
    const area = d.nome.split("::")[0];
    if (!grupos.has(area)) grupos.set(area, []);
    grupos.get(area).push(d);
  }
  const ordem = (a) => { const i = AREAS.indexOf(a); return i < 0 ? 99 : i; };
  return [...grupos.entries()].sort((a, b) => ordem(a[0]) - ordem(b[0]) || a[0].localeCompare(b[0]));
}
const num = (v, cls) => `<span class="${cls} ${v ? "" : "zero"}">${v}</span>`;

/* ---------- traçado de ECG com os últimos 14 dias ---------- */
function tracadoEcg(dias) {
  const W = 336, H = 70, base = 44, larg = W / dias.length;
  const max = Math.max(1, ...dias.map((d) => d.n));
  let p = `M0 ${base}`;
  dias.forEach((d, i) => {
    const x = i * larg;
    if (!d.n) { p += ` L${(x + larg).toFixed(1)} ${base}`; return; }
    const alt = 10 + (d.n / max) * 30;
    const c = x + larg * 0.55;
    p += ` L${(x + larg * 0.22).toFixed(1)} ${base} Q${(x + larg * 0.3).toFixed(1)} ${base - 4} ${(x + larg * 0.38).toFixed(1)} ${base}`
      + ` L${(c - 3).toFixed(1)} ${base} L${(c - 1.5).toFixed(1)} ${base + 4} L${c.toFixed(1)} ${(base - alt).toFixed(1)} L${(c + 2).toFixed(1)} ${base + 7} L${(c + 4).toFixed(1)} ${base}`
      + ` Q${(c + 8).toFixed(1)} ${base - 6} ${(c + 12).toFixed(1)} ${base} L${(x + larg).toFixed(1)} ${base}`;
  });
  const total = dias.reduce((s, d) => s + d.n, 0);
  const rotulo = `Cards respondidos nos últimos 14 dias: ${total}. ${dias.filter((d) => d.n).length} dias com estudo.`;
  return `<svg class="tracado" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${rotulo}">
    <path class="anima" d="${p}" style="--comp:6000" vector-effect="non-scaling-stroke"/>
    ${dias.map((d, i) => `<rect x="${i * larg}" y="0" width="${larg}" height="${H}" fill="transparent" data-dica="${esc(d.rotulo)}: ${d.n} ${d.n === 1 ? "card" : "cards"}"/>`).join("")}
  </svg>`;
}
const chaveDia = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function ultimosDias(porDia, n) {
  const mapa = Object.fromEntries(porDia.map((d) => [String(d.dia).slice(0, 10), d]));
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - i);
    const r = mapa[chaveDia(d)];
    out.push({ d, k: chaveDia(d), n: N(r?.respostas), acertos: N(r?.acertos), rotulo: i === 0 ? "Hoje" : d.toLocaleDateString("pt-BR", { weekday: "short", day: "numeric", month: "short" }) });
  }
  return out;
}

// Dica flutuante para gráficos (passar o mouse ou tocar)
const dica = document.getElementById("dica");
function ativarDicas(raiz) {
  raiz.querySelectorAll("[data-dica]").forEach((el) => {
    const mostrar = (ev) => {
      dica.textContent = el.dataset.dica; dica.hidden = false;
      const r = el.getBoundingClientRect();
      const x = Math.min(window.innerWidth - dica.offsetWidth - 8, Math.max(8, r.left + r.width / 2 - dica.offsetWidth / 2));
      dica.style.left = x + "px"; dica.style.top = Math.max(8, r.top - dica.offsetHeight - 8) + "px";
    };
    el.addEventListener("mouseenter", mostrar);
    el.addEventListener("touchstart", mostrar, { passive: true });
    el.addEventListener("mouseleave", () => { dica.hidden = true; });
  });
}
document.addEventListener("scroll", () => { dica.hidden = true; }, { passive: true });

/* =====================================================================
   ENTRADA (login, recuperar, definir senha)
   ===================================================================== */
function telaEntrada(modo = "login", mensagem = "") {
  mostrarMoldura(false);
  const titulos = {
    login: ["Entrar", "Seus flashcards para a residência, com revisão espaçada."],
    cadastro: ["Teste grátis por 2 horas", "Crie sua conta e use a plataforma completa. Sem cartão."],
    recuperar: ["Recuperar senha", "Enviaremos um link para você criar uma nova senha."],
    definir: ["Crie sua senha", "Defina a senha que você vai usar para entrar."],
  };
  const [t, sub] = titulos[modo];
  tela.innerHTML = `
  <section class="entrada">
    <div class="entrada-caixa">
      <div class="marca"><span class="selo-marca">${ico("pulso")}</span><span>${esc(CONFIG.NOME)}</span></div>
      <div><h1>${t}</h1><p class="sub">${sub}</p></div>
      <form class="caixa" id="form-entrada" novalidate>
        ${mensagem}
        ${modo === "cadastro" ? `
        <div class="campo"><label for="nome">Seu nome</label>
          <input id="nome" autocomplete="name" required maxlength="80"></div>` : ""}
        ${modo !== "definir" ? `
        <div class="campo"><label for="email">E-mail</label>
          <input id="email" type="email" autocomplete="email" required value="${MODO_DEMO ? "aluno@exemplo.com" : ""}"></div>` : ""}
        ${modo !== "recuperar" ? `
        <div class="campo"><label for="senha">${modo === "definir" ? "Nova senha" : "Senha"}</label>
          <input id="senha" type="password" autocomplete="${modo === "definir" || modo === "cadastro" ? "new-password" : "current-password"}" minlength="8" required value="${MODO_DEMO && modo === "login" ? "demonstracao" : ""}" ${modo === "cadastro" ? 'placeholder="Mínimo de 8 caracteres"' : ""}></div>` : ""}
        ${modo === "definir" ? `
        <div class="campo"><label for="senha2">Repita a senha</label>
          <input id="senha2" type="password" autocomplete="new-password" minlength="8" required></div>` : ""}
        <div id="erro-entrada"></div>
        <button class="btn btn-primario" type="submit" id="btn-entrada">${{ login: "Entrar", recuperar: "Enviar link", definir: "Salvar senha e entrar", cadastro: "Criar conta e começar" }[modo]}</button>

        ${modo === "recuperar" || modo === "cadastro" ? `<button type="button" class="btn-texto" id="ir-login">${modo === "cadastro" ? "Já tenho conta: entrar" : "Voltar para o login"}</button>` : ""}
      </form>
      ${modo === "login" ? `
      <div class="caixa" style="padding:18px;display:grid;gap:10px">
        <strong>Ainda não tem conta?</strong>
        <p class="texto-2">Teste a plataforma completa por ${CONFIG.HORAS_TESTE} horas, sem cartão. Depois, planos a partir de ${dinheiro(CONFIG.PRECO_ANUAL / 12)} por mês.</p>

  document.getElementById("ir-recuperar")?.addEventListener("click", () => telaEntrada("recuperar"));
  document.getElementById("ir-login")?.addEventListener("click", () => telaEntrada("login"));

        const senha = document.getElementById("senha").value;
        if (!email || !senha) throw new Error("Informe e-mail e senha.");
        sessao = await api.entrar(email, senha);
        await aposEntrar();
      } else if (modo === "cadastro") {
        const nome = document.getElementById("nome").value.trim();
        const email = document.getElementById("email").value.trim();
        const senha = document.getElementById("senha").value;
        if (!nome || !email) throw new Error("Informe seu nome e e-mail.");
        if (senha.length < 8) throw new Error("A senha precisa ter pelo menos 8 caracteres.");
        sessao = await api.cadastrar(nome, email, senha);
        if (!sessao) return telaEntrada("login", `<div class="msg msg-ok">Conta criada. Enviamos um link de confirmação para ${esc(email)}: abra e depois entre aqui.</div>`);
        toast(`Conta criada. Seu teste grátis de ${CONFIG.HORAS_TESTE} horas começou.`);
        await aposEntrar();
      } else if (modo === "recuperar") {
        const email = document.getElementById("email").value.trim();
        if (!email) throw new Error("Informe o e-mail da sua assinatura.");
        await api.enviarRecuperacao(email);
        telaEntrada("login", `<div class="msg msg-ok">Se o e-mail estiver cadastrado, o link chega em instantes. Confira também a caixa de spam.</div>`);
      } else {
        const s1 = document.getElementById("senha").value, s2 = document.getElementById("senha2").value;
        if (s1.length < 8) throw new Error("A senha precisa ter pelo menos 8 caracteres.");

        await api.definirSenha(s1);
        history.replaceState(null, "", location.pathname);
        sessao = await api.sessao();
        toast("Senha salva.");
        await aposEntrar();
      }
    } catch (e) {
      caixaErro.innerHTML = `<div class="msg msg-erro">${esc(e.message)}</div>`;
    } finally { btn.disabled = false; }
  });
}

async function aposEntrar() {
  try { await api.registrarDispositivo(); } catch { /* segue mesmo assim */ }
  assinatura = await api.assinatura().catch(() => null);
  atualizarFaixa();
  vigiarDispositivo();

}

const dinheiro = (v) => Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL", minimumFractionDigits: Number.isInteger(Number(v)) ? 0 : 2 });
const fmtVenc = (iso) => iso ? fmtData(new Date(new Date(iso).getTime() - 60000).toISOString()) : "—"; // acesso vai até 00:00 do dia seguinte
function restanteTeste() {
  const ms = new Date(assinatura?.teste_ate ?? 0).getTime() - Date.now();
  if (ms <= 0) return "";
  const total = Math.ceil(ms / 60000), h = Math.floor(total / 60), m = total % 60;
  return h ? `${h}h ${String(m).padStart(2, "0")}min` : `${m} min`;
}
let relogioTeste = null;
function atualizarFaixa() {
  const emTeste = !!assinatura?.em_teste;
  document.querySelectorAll(".so-teste").forEach((b) => { b.hidden = !!assinatura?.assinante; });
  const faixa = document.getElementById("faixa-teste");
  faixa.hidden = !emTeste || telaAtual === "estudo";
  if (emTeste) document.getElementById("faixa-texto").innerHTML = `Teste grátis: <strong>${restanteTeste() || "terminando"}</strong> restantes`;
  clearInterval(relogioTeste);
  if (emTeste) relogioTeste = setInterval(async () => {
    if (restanteTeste()) { document.getElementById("faixa-texto").innerHTML = `Teste grátis: <strong>${restanteTeste()}</strong> restantes`; return; }
    clearInterval(relogioTeste);
    assinatura = await api.assinatura().catch(() => assinatura);
    atualizarFaixa();
    if (!assinatura?.acesso) telaPlanos({ bloqueado: true });
  }, 30000);
}
document.getElementById("faixa-planos").addEventListener("click", () => ir("planos"));
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || !sessao || !api) return;
  const antes = JSON.stringify([assinatura?.assinante, assinatura?.plano, assinatura?.acesso]);
  assinatura = await api.assinatura().catch(() => assinatura);

/* ---------- folhas (janelas que sobem da parte de baixo) ---------- */
function abrirFolha(html, rotulo) {
  const fundo = document.createElement("div");
  fundo.className = "folha-fundo";
  fundo.innerHTML = `<div class="folha" role="dialog" aria-modal="true" aria-label="${esc(rotulo)}">${html}</div>`;
  document.body.appendChild(fundo);
  const fechar = () => { fundo.remove(); document.removeEventListener("keydown", tecla); };
  const tecla = (e) => { if (e.key === "Escape") fechar(); };
  document.addEventListener("keydown", tecla);
  fundo.addEventListener("click", (e) => { if (e.target === fundo) fechar(); });
  fundo.querySelectorAll("[data-fechar]").forEach((b) => { b.onclick = fechar; });
  return { el: fundo, fechar, $: (sel) => fundo.querySelector(sel) };
}
const topoFolha = (titulo) => `<div class="folha-topo"><h2>${esc(titulo)}</h2><button class="btn-ico" data-fechar aria-label="Fechar">${ico("fechar")}</button></div>`;
const erroNaFolha = (f, e) => { f.$(".erro-folha").innerHTML = `<div class="msg msg-erro">${esc(e.message)}</div>`; };

const paraHtml = (t) => esc(String(t).trim()).replace(/\r?\n/g, "<br>");
const paraTexto = (h) => { const d = document.createElement("div"); d.innerHTML = String(h).replace(/<br\s*\/?>/gi, "\n").replace(/<\/(div|p|li)>/gi, "\n"); return d.textContent.trim(); };
const SEP_RESPOSTA = /<hr[^>]*id=["']?answer["']?[^>]*>/i;
const editavel = (c) => !/<(img|table|video|audio|svg)/i.test(c.frente + c.verso);

function criarDeck(depois) {
  const f = abrirFolha(`${topoFolha("Novo deck")}
    <form id="form-deck" class="campo" style="gap:14px">
      <div class="campo"><label for="nome-deck">Nome do deck</label><input id="nome-deck" maxlength="80" required placeholder="Ex.: Revisão final de cardio" autocomplete="off"></div>
      <p class="texto-2">Seus decks ficam em "Meus decks" e só você vê. Escreva cards próprios ou copie cards da busca.</p>
      <div class="erro-folha"></div>

    </form>`, "Novo deck");
  f.$("[data-fechar]:not(.btn-ico)").onclick = f.fechar;

  const novo = !card;

  const versoTxt = novo ? "" : paraTexto(String(card.verso).split(SEP_RESPOSTA).at(-1));
  const f = abrirFolha(`${topoFolha(novo ? "Novo card" : "Editar card")}
    <form id="form-card" style="display:grid;gap:14px">
      <div class="campo"><label for="frente">Frente (pergunta)</label><textarea id="frente" maxlength="20000" required placeholder="Ex.: Qual o antídoto da intoxicação por sulfato de magnésio?">${esc(frenteTxt)}</textarea></div>
      <div class="campo"><label for="verso">Verso (resposta)</label><textarea id="verso" maxlength="20000" placeholder="Ex.: Gluconato de cálcio 10%, 10 mL IV lento.">${esc(versoTxt)}</textarea></div>

      <div class="botoes">
        ${novo ? `<button type="button" class="btn" id="salvar-outro">Salvar e criar outro</button>` : `<button type="button" class="btn" data-fechar>Cancelar</button>`}
        <button class="btn btn-primario">Salvar card</button>
      </div>
    </form>`, novo ? "Novo card" : "Editar card");
  f.$("#frente").focus();
  async function salvar(continuar) {
    const fr = f.$("#frente").value, vs = f.$("#verso").value;
    const frente = paraHtml(fr), verso = `${frente}<hr id="answer">${paraHtml(vs)}`;
    try {
      await api.salvarCard(deckId, card?.id ?? null, frente, verso);
      invalidarDecks(); toast(novo ? "Card criado." : "Card salvo.");
      if (continuar) { f.$("#frente").value = ""; f.$("#verso").value = ""; f.$(".erro-folha").innerHTML = ""; f.$("#frente").focus(); }
      else f.fechar();
      aoSalvar?.();
    } catch (err) { erroNaFolha(f, err); }
  }
  f.$("#form-card").onsubmit = (e) => { e.preventDefault(); salvar(false); };
  f.$("#salvar-outro")?.addEventListener("click", () => salvar(true));
  f.$("[data-fechar]:not(.btn-ico)")?.addEventListener("click", f.fechar);
}
