// Lista, cria, edita e exclui os cards de um deck do aluno
async function gerenciarDeck(deck, titulo) {
  const recarregar = () => { invalidarDecks(); telaDeck({ ids: [deck.id] }); };
  document.getElementById("add-card").onclick = () => editarCard(deck.id, null, recarregar);
  document.getElementById("renomear").onclick = () => {
    const f = abrirFolha(`${topoFolha("Renomear deck")}
      <form id="form-ren" style="display:grid;gap:14px"><div class="campo"><label for="novo-nome">Nome</label><input id="novo-nome" maxlength="80" value="${esc(folhaDoNome(titulo))}"></div>
      <div class="erro-folha"></div><div class="botoes"><button class="btn btn-primario">Salvar</button></div></form>`, "Renomear deck");
    f.$("#novo-nome").select();
    f.$("#form-ren").onsubmit = async (e) => {
      e.preventDefault();
      try { await api.renomearDeck(deck.id, f.$("#novo-nome").value); f.fechar(); toast("Deck renomeado."); recarregar(); } catch (err) { erroNaFolha(f, err); }
    };
  };
  document.getElementById("arquivar").onclick = () => {
    const f = abrirFolha(`${topoFolha("Excluir deck?")}
      <p>O deck "${esc(folhaDoNome(titulo))}" e os ${N(deck.total)} cards dele saem da sua lista. Os cards da plataforma não são afetados.</p>
      <div class="erro-folha"></div><div class="botoes"><button class="btn" data-fechar>Cancelar</button><button class="btn btn-primario" id="confirmar">Excluir deck</button></div>`, "Excluir deck");
    f.el.querySelectorAll(".botoes [data-fechar]").forEach((b) => { b.onclick = f.fechar; });
    f.$("#confirmar").onclick = async () => {
      try { await api.arquivarDeck(deck.id); f.fechar(); invalidarDecks(); toast("Deck excluído."); ir("decks"); } catch (err) { erroNaFolha(f, err); }
    };
  };
  const caixa = document.getElementById("lista-cards");
  let lista;
  try { lista = await api.cardsDoDeck(deck.id); } catch (e) { caixa.innerHTML = `<div class="msg msg-erro">${esc(e.message)}</div>`; return; }
  if (!document.body.contains(caixa)) return;
  if (!lista.length) {
    caixa.innerHTML = `<div class="vazio">Este deck ainda não tem cards. Toque em "Adicionar card" ou copie cards pela busca, no botão ${ico("copiar", "ico-p")} de cada resultado.</div>`;
    return;
  }
  caixa.innerHTML = lista.map((c, i) => `
    <div class="card-item">
      <span class="frente">${esc(textoPuro(c.frente)) || "(imagem)"}</span>
      ${editavel(c) ? `<button class="btn-ico" data-editar="${i}" aria-label="Editar card">${ico("lapis", "ico-p")}</button>` : `<span></span>`}
      <button class="btn-ico" data-excluir="${i}" aria-label="Excluir card">${ico("lixo", "ico-p")}</button>
    </div>`).join("");
  caixa.querySelectorAll("[data-editar]").forEach((b) => b.addEventListener("click", () => editarCard(deck.id, lista[+b.dataset.editar], recarregar)));
  caixa.querySelectorAll("[data-excluir]").forEach((b) => b.addEventListener("click", async () => {
    const card = lista[+b.dataset.excluir];
    try { await api.excluirCard(card.id); toast("Card excluído."); recarregar(); } catch (e) { toast(e.message); }
  }));
}

// Lembra de onde o aluno veio, para os botões "Voltar" e "Encerrar sessão"
let telaAnterior = "decks", origemEstudo = { nome: "inicio", args: [] }, argsAtuais = [];
const _ir = ir;
ir = function (nome, ...args) {
  if (nome === "deck" && telaAtual !== "deck") telaAnterior = telaAtual;
  if (nome === "estudo") origemEstudo = { nome: telaAtual, args: argsAtuais };
  argsAtuais = args;
  return _ir(nome, ...args);
};

/* =====================================================================
   ESTUDO (fluxo do Anki)
   ===================================================================== */
async function telaEstudo(ids, nome, modo = "normal") {
  carregando("Montando sua sessão…");
  let fila, favs;
  try {
    [fila, favs] = await Promise.all([modo === "favoritos" ? api.filaFavoritos() : api.fila(ids, novosPorDia()), api.favoritosIds().catch(() => new Set())]);
  } catch (e) {
    if (/acesso|permission|denied/i.test(e.message)) { assinatura = await api.assinatura().catch(() => null); if (!assinatura?.acesso) return telaSemAcesso(); }
    return falha(e);
  }
  // Ordem do Anki: aprendendo, revisões e novos intercalados no fim
  fila.sort((a, b) => (a.novo === b.novo ? 0 : a.novo ? 1 : -1));
  let feitos = 0, acertos = 0, virado = false, atual = null, ocupado = false;
  const origem = origemEstudo;
  const voltar = () => { cacheDecks = null; ir(origem.nome === "estudo" ? "inicio" : origem.nome, ...origem.args); };
  cacheDecks = null;

  const marcaDagua = (() => {
    const txt = esc(sessao?.user?.email ?? "");
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="260" height="120"><text x="0" y="70" transform="rotate(-18 130 60)" font-family="sans-serif" font-size="13" fill="currentColor">${txt}</text></svg>`;
    return `url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}")`;
  })();
  const tipoDe = (c) => c.novo ? "novo" : c.estado === "aprendendo" ? "apr" : "rev";

  function restantes() {
    const n = fila.filter((c) => tipoDe(c) === "novo").length;
    const a = fila.filter((c) => tipoDe(c) === "apr").length;
    const r = fila.filter((c) => tipoDe(c) === "rev").length;
    const t = atual ? tipoDe(atual) : "";
    return `<div class="restantes" aria-label="${n} novos, ${a} aprendendo, ${r} para revisar">
      <span class="c-novo ${t === "novo" ? "atual" : ""} ${n ? "" : "zero"}">${n}</span>
      <span class="c-apr ${t === "apr" ? "atual" : ""} ${a ? "" : "zero"}">${a}</span>
      <span class="c-rev ${t === "rev" ? "atual" : ""} ${r ? "" : "zero"}">${r}</span></div>`;
  }

  function desenhar() {
    if (!fila.length) {
      const pct = feitos ? Math.round((acertos / feitos) * 100) : 0;
      tela.innerHTML = `
      <section class="estudo"><div class="fim caixa">
        <span class="selo-marca" style="width:56px;height:56px;border-radius:16px;background:var(--pulso-suave);color:var(--pulso);display:grid;place-items:center">${ico("pulso")}</span>
        <h2>${feitos ? "Sessão concluída" : "Nada para estudar agora"}</h2>
        <p>${feitos
          ? `Você respondeu ${feitos} ${feitos === 1 ? "card" : "cards"} com ${pct}% de acerto. As próximas revisões aparecem quando vencerem.`
          : `Você já fez as revisões de hoje e chegou ao limite de ${novosPorDia()} cards novos por dia. Dá para mudar o limite em Perfil.`}</p>
        <button class="btn btn-primario" id="voltar">Voltar</button>
      </div></section>`;
      document.getElementById("voltar").onclick = () => voltar();
      return;
    }
    atual = fila[0];
    const fav = favs.has(atual.card_id);
    const tipo = { novo: `<span class="c-novo">Novo</span>`, apr: `<span class="c-apr">Aprendendo</span>`, rev: `<span class="c-rev">Revisão</span>` }[tipoDe(atual)];
    tela.innerHTML = `
    <section class="estudo">
      <div class="estudo-topo">
        <button class="btn-ico" id="voltar" aria-label="Encerrar sessão">${ico("fechar")}</button>
        <span class="titulo">${esc(caminho(nome))}</span>
        <button class="btn-ico" id="favoritar" aria-pressed="${fav}" aria-label="${fav ? "Remover dos favoritos" : "Adicionar aos favoritos"}">${ico("coracao")}</button>
      </div>
      ${restantes()}
      <div class="prog-sessao" aria-hidden="true"><i style="width:${Math.min(100, (feitos / (feitos + fila.length)) * 100)}%"></i></div>
      <article class="caixa card" id="card" aria-live="polite">
        <div class="marca-dagua" style="background-image:${marcaDagua};color:var(--tinta)"></div>
        <span class="tipo-card">${tipo}</span>
        <div class="card-conteudo virando">${virado ? atual.verso : atual.frente}</div>
      </article>
      <div class="acoes">
        ${virado ? `
        <div class="respostas" role="group" aria-label="Como foi?">
          ${[[1, "Novamente"], [2, "Difícil"], [3, "Bom"], [4, "Fácil"]].map(([n, t]) =>
            `<button class="resp" data-nota="${n}"><small>${SRS.rotulo(atual, n)}</small>${t}</button>`).join("")}
        </div>
        <p class="atalhos"><kbd>1</kbd> Novamente · <kbd>2</kbd> Difícil · <kbd>3</kbd> ou <kbd>Espaço</kbd> Bom · <kbd>4</kbd> Fácil</p>` : `
        <button class="btn btn-primario mostrar" id="mostrar">Mostrar resposta</button>
        <p class="atalhos"><kbd>Espaço</kbd> mostra a resposta</p>`}
      </div>
    </section>`;
    document.getElementById("voltar").onclick = () => voltar();
    document.getElementById("favoritar").onclick = alternarFav;
    document.getElementById("card").addEventListener("contextmenu", (e) => e.preventDefault());
    document.getElementById("mostrar")?.addEventListener("click", virar);
    tela.querySelectorAll(".resp").forEach((b) => b.addEventListener("click", () => responder(Number(b.dataset.nota))));
  }

  async function alternarFav() {
    const id = atual.card_id;
    try {
      const ativo = await api.alternarFavorito(id);
      if (ativo) favs.add(id); else favs.delete(id);
      toast(ativo ? "Adicionado aos favoritos." : "Removido dos favoritos.");
      const b = document.getElementById("favoritar");
      b.setAttribute("aria-pressed", ativo); b.setAttribute("aria-label", ativo ? "Remover dos favoritos" : "Adicionar aos favoritos");
    } catch { toast("Não foi possível salvar o favorito."); }
  }

  function virar() { virado = true; desenhar(); document.querySelector(".resp[data-nota='3']")?.focus({ preventScroll: true }); }

  async function responder(nota) {
    if (ocupado || !atual) return;
    ocupado = true;
    const card = fila.shift();
    const r = SRS.proximo(card, nota);
    feitos++; if (nota >= 3) acertos++;
    try { await api.responder(card, nota, r); }
    catch (e) {
      fila.unshift(card); feitos--; if (nota >= 3) acertos--;
      toast("Não foi possível salvar a resposta. Verifique sua conexão.");
      ocupado = false; return;
    }
    // Cards em aprendizado voltam ainda nesta sessão, como no Anki
    if (r.estado === "aprendendo") fila.splice(Math.min(fila.length, nota === 1 ? 3 : 6), 0, { ...card, ...r, novo: false });
    virado = false; ocupado = false;
    desenhar();
  }

  function teclas(e) {
    if (!document.getElementById("card")) { document.removeEventListener("keydown", teclas); return; }
    if (e.target.matches("input, textarea")) return;
    if (!virado && (e.code === "Space" || e.key === "Enter")) { e.preventDefault(); virar(); }
    else if (virado && ["1", "2", "3", "4"].includes(e.key)) { e.preventDefault(); responder(Number(e.key)); }
    else if (virado && (e.code === "Space" || e.key === "Enter")) { e.preventDefault(); responder(3); }
    else if (e.key === "Escape") voltar();
  }
  document.addEventListener("keydown", teclas);
  desenhar();
}

/* =====================================================================
   BUSCA (o "Navegador" do Anki)
   ===================================================================== */
async function telaBusca(termoInicial = "", soFavInicial = false) {
  let termo = termoInicial, soFav = soFavInicial;
  tela.innerHTML = `
  <div class="titulo-pag"><div><h1>Buscar</h1><p>Encontre decks e cards pelo nome, pelo texto ou pela área.</p></div></div>
  <form class="busca-linha" id="form-busca" role="search" style="grid-template-columns:1fr">
    <label class="busca-campo"><span class="sr">Buscar nos cards</span>${ico("busca")}
      <input id="termo" type="search" placeholder="Ex.: Glasgow, pré-eclâmpsia, Child-Pugh" value="${esc(termo)}" enterkeyhint="search"></label>
  </form>
  <div class="chips" role="group" aria-label="Filtro" style="margin-top:12px">
    <button class="chip" type="button" data-fav="0" aria-pressed="${!soFav}">Tudo</button>
    <button class="chip" type="button" data-fav="1" aria-pressed="${soFav}">Favoritos</button>
  </div>
  <section class="caixa resultados" id="resultados"><div class="vazio">Buscando…</div></section>`;

  const caixa = document.getElementById("resultados");
  const input = document.getElementById("termo");
  const estadoDe = (r) => {
    if (!r.estado) return `<span class="estado c-novo">Novo</span>`;
    if (r.estado === "aprendendo") return `<span class="estado c-apr">Aprendendo</span>`;
    const dias = Math.round((new Date(r.vencimento) - Date.now()) / 86400000);
    return `<span class="estado c-rev">${r.intervalo >= 21 ? "Maduro" : "Jovem"} · ${dias <= 0 ? "revisar hoje" : `revisão em ${dias} ${dias === 1 ? "dia" : "dias"}`}</span>`;
  };
  let pedido = 0, verTodosDecks = false;
  async function buscar() {
    const meuPedido = ++pedido;
    caixa.classList.add("ocupado-leve");
    let lista, decksAchados = [];
    const t = semAcento(termo.trim());
    try {
      const [cards, todos] = await Promise.all([api.buscar(termo.trim(), soFav), !soFav && t ? obterDecks() : Promise.resolve([])]);
      lista = cards;
      decksAchados = todos.filter((d) => semAcento(d.nome).includes(t));
    } catch (e) { caixa.innerHTML = `<div class="msg msg-erro">${esc(e.message)}</div>`; return; }
    if (meuPedido !== pedido) return; // chegou resposta de uma busca antiga
    if (!lista.length && !decksAchados.length) {
      caixa.innerHTML = `<div class="vazio">${soFav ? (termo ? "Nenhum favorito com esse termo." : "Você ainda não tem favoritos. Toque no coração durante o estudo para guardar um card aqui.") : "Nada encontrado. Tente outra palavra ou o nome de uma área."}</div>`;
      return;
    }
    const mostrarDecks = verTodosDecks ? decksAchados : decksAchados.slice(0, 5);
    const blocoDecks = decksAchados.length ? `
      <div class="res-cab">Decks <span>${decksAchados.length}</span></div>
      ${mostrarDecks.map((d) => { const k = contar([d]); return `
        <button class="deck-achado" data-deck="${esc(d.id)}">
          <span class="ic">${ico(iconeDe(d.nome))}</span>
          <span><strong>${esc(folhaDoNome(d.nome))}</strong><small>${esc(d.nome.includes("::") ? d.nome.split("::").slice(0, -1).join(" › ") + " · " : "")}${d.total} ${N(d.total) === 1 ? "card" : "cards"}</small></span>
          <span class="mini-contagens">${num(k.novos, "c-novo")}${num(k.aprendendo, "c-apr")}${num(k.revisar, "c-rev")}</span>
          ${ico("seta")}
        </button>`; }).join("")}
      ${decksAchados.length > mostrarDecks.length ? `<button class="mais-res" id="mais-decks">Ver os ${decksAchados.length} decks</button>` : ""}` : "";
    const blocoCards = lista.length ? `
      ${soFav ? `<div style="padding:14px 16px;border-bottom:1px solid var(--linha);display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="texto-2">${lista.length} ${lista.length === 1 ? "favorito" : "favoritos"}</span><button class="btn btn-primario" id="estudar-favs">${ico("play", "ico-p")} Estudar favoritos</button></div>`
        : `<div class="res-cab">Cards <span>${lista.length >= 60 ? "60 primeiros" : lista.length}</span></div>`}
      ${lista.map((r, i) => `
      <div class="resultado" style="grid-template-columns:minmax(0,1fr) auto auto">
        <button class="abrir" data-i="${i}"><span class="caminho">${esc(caminho(r.deck))}</span><span class="frente">${esc(textoPuro(r.frente))}</span>${estadoDe(r)}</button>
        ${ehMeu(r.deck) ? "<span></span>" : `<button class="btn-ico" data-copiar="${esc(r.card_id)}" aria-label="Copiar para meu deck">${ico("copiar")}</button>`}
        <button class="btn-ico" data-fav-id="${esc(r.card_id)}" aria-pressed="${!!r.favorito}" aria-label="${r.favorito ? "Remover dos favoritos" : "Adicionar aos favoritos"}">${ico("coracao")}</button>
      </div>`).join("")}` : "";
    caixa.innerHTML = blocoDecks + blocoCards;
    caixa.classList.remove("ocupado-leve");
    document.getElementById("estudar-favs")?.addEventListener("click", () => ir("estudo", [], "Favoritos", "favoritos"));
    document.getElementById("mais-decks")?.addEventListener("click", () => { verTodosDecks = true; buscar(); });
    caixa.querySelectorAll("[data-deck]").forEach((b) => b.addEventListener("click", () => ir("deck", { ids: [b.dataset.deck] })));
    caixa.querySelectorAll("[data-copiar]").forEach((b) => b.addEventListener("click", () => copiarParaMeuDeck(b.dataset.copiar)));
    caixa.querySelectorAll("[data-i]").forEach((b) => b.addEventListener("click", () => verCard(lista[+b.dataset.i])));
    caixa.querySelectorAll("[data-fav-id]").forEach((b) => b.addEventListener("click", async () => {
      try {
        const ativo = await api.alternarFavorito(b.dataset.favId);
        b.setAttribute("aria-pressed", ativo); toast(ativo ? "Adicionado aos favoritos." : "Removido dos favoritos.");
        const item = lista.find((x) => x.card_id === b.dataset.favId); if (item) item.favorito = ativo;
      } catch { toast("Não foi possível salvar o favorito."); }
    }));
  }
  function verCard(r) {
    const f = abrirFolha(`<div class="folha-topo"><span>${esc(caminho(r.deck))}</span><button class="btn-ico" data-fechar aria-label="Fechar">${ico("fechar")}</button></div>
      <article class="caixa card" oncontextmenu="return false"><div class="card-conteudo">${r.verso}</div></article>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">${estadoDe(r)}
        ${ehMeu(r.deck) ? "" : `<button class="btn" id="copiar-folha">${ico("copiar", "ico-p")} Copiar para meu deck</button>`}</div>`, "Card");
    f.$("[data-fechar]").focus();
    f.$("#copiar-folha")?.addEventListener("click", () => { f.fechar(); copiarParaMeuDeck(r.card_id); });
  }
  document.getElementById("form-busca").onsubmit = (e) => { e.preventDefault(); input.blur(); };
  input.addEventListener("input", () => { clearTimeout(input._t); input._t = setTimeout(() => { termo = input.value; verTodosDecks = false; buscar(); }, 250); });
  tela.querySelectorAll("[data-fav]").forEach((b) => b.addEventListener("click", () => {
    soFav = b.dataset.fav === "1";
    tela.querySelectorAll("[data-fav]").forEach((x) => x.setAttribute("aria-pressed", x === b));
    buscar();
  }));
  if (!termo && !soFav) input.focus({ preventScroll: true });
  buscar();
}

/* =====================================================================
   ESTATÍSTICAS (calendário, previsão e situação dos cards, como no Anki)
   ===================================================================== */
async function telaStats() {
  carregando("Calculando…");
  let porDeck, porDia, previsao, estados;
  try { [porDeck, porDia, previsao, estados] = await Promise.all([api.estatisticas(), api.porDia(119), api.previsao(), api.estados()]); }
  catch (e) { return falha(e); }

  const dias = ultimosDias(porDia, 119);
  const ult30 = dias.slice(-30);
  const total30 = ult30.reduce((s, d) => s + d.n, 0);
  const certos30 = ult30.reduce((s, d) => s + d.acertos, 0);
  const hoje = dias.at(-1);
  let seq = 0; for (let i = dias.length - 1; i >= 0; i--) { if (dias[i].n > 0) seq++; else if (i !== dias.length - 1) break; }
  const e = { novos: N(estados.novos), aprendendo: N(estados.aprendendo), jovens: N(estados.jovens), maduros: N(estados.maduros) };

  // Calendário (heatmap): colunas = semanas, linhas = dias da semana
  const inicio = new Date(dias[0].d); inicio.setDate(inicio.getDate() - inicio.getDay());
  const mapa = Object.fromEntries(dias.map((d) => [d.k, d]));
  const cel = 13, gap = 3, semanas = Math.ceil((dias.length + dias[0].d.getDay()) / 7);
  const maxDia = Math.max(1, ...dias.map((d) => d.n));
  const nivel = (n) => !n ? 0 : n <= maxDia * 0.25 ? 1 : n <= maxDia * 0.5 ? 2 : n <= maxDia * 0.75 ? 3 : 4;
  const corNivel = ["var(--superficie-2)", "color-mix(in srgb, var(--pulso) 28%, var(--superficie))", "color-mix(in srgb, var(--pulso) 52%, var(--superficie))", "color-mix(in srgb, var(--pulso) 76%, var(--superficie))", "var(--pulso)"];
  let celulas = "", meses = "";
  for (let s = 0; s < semanas; s++) {
    for (let w = 0; w < 7; w++) {
      const d = new Date(inicio); d.setDate(inicio.getDate() + s * 7 + w);
      const item = mapa[chaveDia(d)];
      if (!item) continue;
      celulas += `<rect class="cel" x="${30 + s * (cel + gap)}" y="${18 + w * (cel + gap)}" width="${cel}" height="${cel}" rx="3" fill="${corNivel[nivel(item.n)]}" data-dica="${esc(d.toLocaleDateString("pt-BR", { weekday: "short", day: "numeric", month: "short" }))}: ${item.n} ${item.n === 1 ? "card" : "cards"}"/>`;
      if (w === 0 && d.getDate() <= 7) meses += `<text x="${30 + s * (cel + gap)}" y="11">${d.toLocaleDateString("pt-BR", { month: "short" }).replace(".", "")}</text>`;
    }
  }
  const diasSemana = ["", "seg", "", "qua", "", "sex", ""].map((t, w) => t ? `<text x="0" y="${18 + w * (cel + gap) + 10}">${t}</text>` : "").join("");
  const largCal = 30 + semanas * (cel + gap);

  // Previsão: revisões que vencem em cada um dos próximos 30 dias
  const prevMapa = Object.fromEntries(previsao.map((p) => [String(p.dia).slice(0, 10), N(p.quantidade)]));
  const prox = [];
  for (let i = 0; i < 30; i++) { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + i); prox.push({ d, n: prevMapa[chaveDia(d)] ?? 0 }); }
  const W = 640, H = 170, mL = 30, mB = 24, mT = 8;
  const maxP = Math.max(4, ...prox.map((p) => p.n));
  const passo = maxP <= 8 ? 2 : maxP <= 20 ? 5 : maxP <= 60 ? 10 : maxP <= 150 ? 25 : 50;
  const topoP = Math.ceil(maxP / passo) * passo;
  const y = (v) => mT + (H - mT - mB) * (1 - v / topoP);
  const bw = (W - mL) / prox.length;
  let grade = "";
  for (let v = 0; v <= topoP; v += passo) grade += `<line x1="${mL}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--linha)" stroke-width="1"/><text x="${mL - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const barras = prox.map((p, i) => {
    const x = mL + i * bw, w = Math.max(2, bw - 4), alt = y(0) - y(p.n);
    const rot = `${i === 0 ? "Hoje" : i === 1 ? "Amanhã" : p.d.toLocaleDateString("pt-BR", { weekday: "short", day: "numeric", month: "short" })}: ${p.n} ${p.n === 1 ? "revisão" : "revisões"}`;
    const marca = p.n ? `<path d="M${x + 2} ${y(0)} V${y(p.n) + Math.min(4, alt)} q0 -4 4 -4 h${w - 8} q4 0 4 4 V${y(0)} Z" fill="var(--revisar)"/>` : "";
    return `<g data-dica="${esc(rot)}"><rect x="${x}" y="${mT}" width="${bw}" height="${H - mT - mB}" fill="transparent"/>${marca}</g>`;
  }).join("");
  const rotX = prox.map((p, i) => i % 7 === 0 ? `<text x="${mL + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${i === 0 ? "hoje" : `${p.d.getDate()}/${p.d.getMonth() + 1}`}</text>` : "").join("");
  const totalPrev = prox.reduce((s, p) => s + p.n, 0);

  // Situação dos cards: barra empilhada única
  const totalE = e.novos + e.aprendendo + e.jovens + e.maduros;
  const seg = [["Novos", e.novos, "var(--novo)"], ["Aprendendo", e.aprendendo, "var(--aprendendo)"], ["Jovens", e.jovens, "var(--jovem)"], ["Maduros", e.maduros, "var(--maduro)"]];

  const selo = (p) => p >= 80 ? `<span class="selo selo-bom">${p}%</span>` : p >= 60 ? `<span class="selo selo-medio">${p}%</span>` : `<span class="selo selo-ruim">${p}%</span>`;

  tela.innerHTML = `
  <div class="titulo-pag"><div><h1>Estatísticas</h1><p>${hoje.n ? `Hoje: ${hoje.n} ${hoje.n === 1 ? "card" : "cards"}, ${Math.round((hoje.acertos / hoje.n) * 100)}% de acerto.` : "Você ainda não estudou hoje."}</p></div></div>
  <div class="kpis">
    <div class="caixa kpi"><b>${total30}</b><span>respostas em 30 dias</span></div>
    <div class="caixa kpi"><b>${total30 ? Math.round((certos30 / total30) * 100) : 0}%</b><span>de acerto em 30 dias</span></div>
    <div class="caixa kpi"><b>${seq}</b><span>${seq === 1 ? "dia seguido" : "dias seguidos"}</span></div>
    <div class="caixa kpi"><b class="c-rev">${e.maduros}</b><span>cards maduros</span></div>
  </div>

  <section class="caixa grafico">
    <h2>Calendário de estudo</h2>
    <p class="nota">Cada quadrado é um dia. Quanto mais forte, mais cards você respondeu.</p>
    <div class="rolagem"><svg class="plot" viewBox="0 0 ${largCal} ${18 + 7 * (cel + gap)}" style="max-width:${largCal * 1.6}px;min-width:${largCal}px" role="img" aria-label="Calendário de estudo das últimas 17 semanas">${meses}${diasSemana}${celulas}</svg></div>
    <div class="legenda"><span>Menos</span>${corNivel.map((c) => `<i style="background:${c}"></i>`).join("")}<span>Mais</span></div>
  </section>

  <section class="caixa grafico">
    <h2>Previsão de revisões</h2>
    <p class="nota">${totalPrev} ${totalPrev === 1 ? "revisão vence" : "revisões vencem"} nos próximos 30 dias. Atrasadas contam para hoje.</p>
    <div class="rolagem"><svg class="plot" viewBox="0 0 ${W + 8} ${H}" role="img" aria-label="Revisões previstas por dia nos próximos 30 dias" style="min-width:480px">${grade}${barras}${rotX}</svg></div>
  </section>

  <section class="caixa grafico">
    <h2>Situação dos cards</h2>
    <p class="nota">Jovens têm intervalo menor que 21 dias; maduros, 21 dias ou mais.</p>
    <div class="barra" style="height:16px;margin-top:14px" role="img" aria-label="${seg.map(([t, v]) => `${t}: ${v}`).join(", ")}">
      ${seg.filter(([, v]) => v).map(([t, v, c]) => `<i style="width:${(v / Math.max(1, totalE)) * 100}%;background:${c};border-radius:4px" data-dica="${t}: ${v}"></i>`).join("")}
    </div>
    <div class="legenda">${seg.map(([t, v, c]) => `<span><i style="background:${c}"></i>${t} <b>${v}</b></span>`).join("")}</div>
  </section>

  <section class="caixa grafico" style="padding:0">
    <div style="padding:18px 18px 6px"><h2>Acerto por deck</h2><p class="nota">Últimos 30 dias. "Bom" e "Fácil" contam como acerto.</p></div>
    <div class="rolagem">
    ${porDeck.length ? `<table class="tab"><thead><tr><th>Deck</th><th class="dir">Respostas</th><th class="dir">Acerto</th></tr></thead><tbody>
      ${porDeck.map((d) => { const p = N(d.respostas) ? Math.round((N(d.acertos) / N(d.respostas)) * 100) : 0;
        return `<tr><td>${esc(caminho(d.deck))}</td><td class="dir">${d.respostas}</td><td class="dir">${selo(p)}</td></tr>`; }).join("")}
    </tbody></table>` : `<div class="vazio">Responda alguns cards para ver seu desempenho por deck.</div>`}
    </div>
  </section>`;
  ativarDicas(tela);
}

const nomePlano = (p) => ({ mensal: "Mensal", anual: "Anual", equipe: "Equipe", cortesia: "Cortesia", teste: "Teste" }[p] ?? p ?? "—");
function linkCheckout(url) {
  if (!url) return "";
  const u = new URL(url);
  const email = sessao?.user?.email, nome = sessao?.user?.user_metadata?.nome;
  if (email) u.searchParams.set("email", email);
  if (nome) u.searchParams.set("name", nome);
  return u.toString();
}
let esperaPagamento = null;
async function telaPlanos(opcoes = {}) {
  const bloqueado = !!opcoes.bloqueado || !assinatura?.acesso;
  mostrarMoldura(true); telaAtual = "planos"; marcarNav("planos");
  document.getElementById("faixa-teste").hidden = !assinatura?.em_teste;
  const cheio = CONFIG.PRECO_MENSAL * 12;
  const economia = Math.round((1 - CONFIG.PRECO_ANUAL / cheio) * 100);
  const porMes = CONFIG.PRECO_ANUAL / 12;
  const ehMensal = assinatura?.assinante && assinatura.plano === "mensal";
  const ehAssinante = !!assinatura?.assinante;
  const st = ["mensal", "anual"].includes(assinatura?.plano) ? assinatura?.status : null; // só planos pagos contam como "venceu"

  const titulo = ehMensal ? "Seu plano" : ehAssinante ? "Seu plano" : bloqueado

    : "Planos";
  const sub = ehMensal ? `Você está no plano mensal. No anual, o mesmo ano sai por ${dinheiro(CONFIG.PRECO_ANUAL)} em vez de ${dinheiro(cheio)}.`

    : bloqueado ? (st === "reembolsada" ? "Sua compra foi reembolsada ou contestada. Para voltar a estudar, assine um plano."
        : st ? `O acesso terminou em ${fmtVenc(assinatura.expira_em)}. Seu progresso continua salvo: assine para continuar de onde parou.`
        : "Gostou? Assine para continuar estudando. Seu progresso e seus decks continuam salvos.")
    : `Você está no teste grátis: ${restanteTeste() || "terminando"} restantes. Assine quando quiser, o progresso continua.`;

  const cartaoAnual = `
    <section class="caixa plano plano-destaque">
      <span class="selo-economia">Economize ${economia}%</span>
      <h2>Plano anual</h2>
      <div class="preco"><s>${dinheiro(cheio)}</s><b>${dinheiro(CONFIG.PRECO_ANUAL)}</b><span>por ano</span></div>
      <p class="equivale">Equivale a <strong>${dinheiro(porMes)} por mês</strong>. Você economiza ${dinheiro(cheio - CONFIG.PRECO_ANUAL)} no ano.</p>
      ${CONFIG.CHECKOUT_ANUAL ? `<a class="btn btn-primario btn-largo" data-checkout href="${esc(linkCheckout(CONFIG.CHECKOUT_ANUAL))}" target="_blank" rel="noopener">${ehMensal ? "Migrar para o anual" : "Assinar o anual"}</a>` : `<button class="btn btn-largo" disabled>Pagamento em configuração</button>`}
    </section>`;
  const cartaoMensal = ehAssinante ? "" : `
    <section class="caixa plano">
      <h2>Plano mensal</h2>
      <div class="preco"><b>${dinheiro(CONFIG.PRECO_MENSAL)}</b><span>por mês</span></div>
      <p class="equivale">Cancele quando quiser.</p>
      ${CONFIG.CHECKOUT_MENSAL ? `<a class="btn btn-largo" data-checkout href="${esc(linkCheckout(CONFIG.CHECKOUT_MENSAL))}" target="_blank" rel="noopener">Assinar o mensal</a>` : `<button class="btn btn-largo" disabled>Pagamento em configuração</button>`}
    </section>`;
  const inclui = ["Todos os decks da plataforma e as próximas atualizações", "Revisão espaçada no estilo Anki", "Seus próprios decks e cards", "Estatísticas, calendário e previsão de revisões", "Celular e computador"];

  tela.innerHTML = `
  <div class="titulo-pag"><div><h1>${titulo}</h1><p>${sub}</p></div></div>
  ${ehAssinante ? `<section class="caixa plano-atual"><strong>Plano ${esc(nomePlano(assinatura.plano))}</strong>
    <span class="texto-2">${assinatura.status === "ativa" && ["mensal", "anual"].includes(assinatura.plano) ? `Próxima cobrança em ${fmtVenc(assinatura.expira_em)}` : `Acesso até ${fmtVenc(assinatura.expira_em)}`}</span></section>` : ""}
  ${!ehAssinante || ehMensal ? `<div class="planos" ${ehMensal ? 'style="grid-template-columns:minmax(0,560px)"' : ""}>${cartaoAnual}${cartaoMensal}</div>` : ""}
  ${ehMensal ? `<section class="caixa convite"><strong>Como migrar</strong>
    <p>1. Assine o anual acima, com o mesmo e-mail (${esc(sessao?.user?.email ?? "")}).<br>2. Depois que o anual for aprovado, cancele a assinatura mensal na sua conta da Kiwify, para não ser cobrado de novo. O acesso segue pelo anual.</p></section>` : ""}
  ${!ehAssinante ? `<section class="caixa convite"><strong>Os dois planos incluem</strong>
    <ul class="inclui">${inclui.map((t) => `<li>${ico("check")}<span>${t}</span></li>`).join("")}</ul>
    <p class="texto-2" style="margin-top:6px">Pague com o mesmo e-mail da sua conta (${esc(sessao?.user?.email ?? "")}). O acesso é liberado automaticamente assim que a Kiwify aprovar o pagamento.</p></section>` : ""}

  ${CONFIG.SUPORTE ? `<p class="texto-2" style="margin-top:14px">Dúvidas? ${esc(CONFIG.SUPORTE)}</p>` : ""}`;

  async function verificar(silencioso) {
    const antes = !!assinatura?.assinante, planoAntes = assinatura?.plano;
    assinatura = await api.assinatura().catch(() => assinatura);
    atualizarFaixa();
    const liberou = assinatura?.assinante && (!antes || assinatura.plano !== planoAntes);
    if (liberou) { clearInterval(esperaPagamento); toast("Pagamento confirmado. Bom estudo!"); cacheDecks = null; return ir("inicio"); }
    if (!silencioso) toast(assinatura?.acesso ? "Ainda não recebemos a confirmação. Pode levar alguns minutos." : "Pagamento ainda não confirmado. Pode levar alguns minutos.");

  tela.querySelectorAll("[data-checkout]").forEach((a) => a.addEventListener("click", () => {

    clearInterval(esperaPagamento);
    let vezes = 0;
    esperaPagamento = setInterval(() => { if (++vezes > 90 || telaAtual !== "planos") return clearInterval(esperaPagamento); verificar(true); }, 10000);
  }));
  document.getElementById("verificar")?.addEventListener("click", () => verificar(false));
  document.getElementById("sair")?.addEventListener("click", sair);
}

      <h2>Aparelhos conectados</h2>
      <p class="texto-2">Sua conta é pessoal. Ao entrar em um aparelho novo além do limite, o mais antigo é desconectado.</p>
      ${disps.map((d) => `<div class="disp"><div><strong>${esc(d.descricao ?? "Aparelho")}</strong>${d.dispositivo === meu ? ` <span class="selo selo-bom">Este aparelho</span>` : ""}<br><small class="texto-2">Último acesso ${new Date(d.ultimo_acesso).toLocaleString("pt-BR")}</small></div>
        ${d.dispositivo !== meu ? `<button class="btn" data-remover="${esc(d.dispositivo)}">Desconectar</button>` : ""}</div>`).join("") || `<p>Nenhum aparelho registrado.</p>`}
    </section>
    <section class="caixa">
      <h2>Senha e acesso</h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" id="trocar-senha">Trocar senha</button>
        <button class="btn" id="sair">Sair</button>
      </div>
      ${CONFIG.SUPORTE ? `<p class="texto-2">Suporte: <span style="user-select:all">${esc(CONFIG.SUPORTE)}</span></p>` : ""}
    </section>
  </div>`;
  document.getElementById("ver-planos")?.addEventListener("click", () => ir("planos"));
  document.getElementById("novos").addEventListener("change", (e) => { guardar.gravar("mf_novos_dia", Number(e.target.value)); toast("Limite de cards novos atualizado."); });
  tela.querySelectorAll("[data-tema]").forEach((b) => b.addEventListener("click", () => {
    aplicarTema(b.dataset.tema);
    tela.querySelectorAll("[data-tema]").forEach((x) => x.setAttribute("aria-pressed", x === b));
  }));
  document.getElementById("sair").onclick = sair;
  document.getElementById("trocar-senha").onclick = () => telaEntrada("definir");
  tela.querySelectorAll("[data-remover]").forEach((b) => b.addEventListener("click", async () => {
    try { await api.removerDispositivo(b.dataset.remover); toast("Aparelho desconectado."); } catch { toast("Não foi possível desconectar."); }
    telaPerfil();
  }));
}

/* =====================================================================
   INICIALIZAÇÃO
   ===================================================================== */
function carregarScript(src) {
  return new Promise((ok, falhou) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => falhou(new Error("Falha ao carregar " + src)); document.head.appendChild(s); });
}

async function iniciar() {
  document.title = CONFIG.NOME;
  document.getElementById("nome-marca").textContent = CONFIG.NOME;
  aplicarTema(guardar.ler("pm_tema", "auto"));
  const hash = new URLSearchParams(location.hash.slice(1));
  const query = new URLSearchParams(location.search);
  const veioDeLink = query.has("definir") || /invite|recovery/.test(hash.get("type") ?? "");
  const erroLink = hash.get("error_description");

  if (MODO_DEMO) {
    document.getElementById("aviso-demo").hidden = false;
    api = criarApiDemo();
  } else {
    try {
      await carregarScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js");
    } catch {
      tela.innerHTML = `<div class="msg msg-erro" style="margin-top:24px">Não foi possível carregar a plataforma. Verifique sua conexão e recarregue a página.</div>`; return;
    }
    const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
      auth: { flowType: "implicit", detectSessionInUrl: true, persistSession: true, autoRefreshToken: true },
    });
    api = criarApiSupabase(sb);
    sb.auth.onAuthStateChange((evento) => { if (evento === "PASSWORD_RECOVERY") telaEntrada("definir"); });
  }

  if (erroLink) {
    history.replaceState(null, "", location.pathname);
    return telaEntrada("recuperar", `<div class="msg msg-erro">Este link expirou ou já foi usado. Peça um novo abaixo.</div>`);
  }
  if (veioDeLink && !MODO_DEMO) await new Promise((r) => setTimeout(r, 400));
  sessao = await api.sessao();
  if (sessao && veioDeLink) return telaEntrada("definir");
  if (sessao) return aposEntrar();
  telaEntrada("login");
}
iniciar();

if ("serviceWorker" in navigator && !MODO_DEMO && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
